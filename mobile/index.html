<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<title>THE ROOT 모바일</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="THE ROOT">
<style>
:root {
  --bg: #0f1512;
  --bg2: #17201b;
  --panel: #1d2822;
  --line: #2f3f36;
  --text: #e9efe7;
  --dim: #9aaa9f;
  --root: #6fd3c1;      /* 실타래, 스크린 */
  --gold: #e3c46b;      /* 기록, 보상 */
  --yellow: #f2d64b;    /* 서린의 노란 실 */
  --red: #e0524f;       /* 붉은 줄 */
  --blue: #5d8fe0;      /* 마루의 파란 헝겊 */
  --undo: #c9c3b6;      /* 해체자 */
  --sky: #8fd3f5;       /* 하늘색 선: 정답과 복원 */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; overscroll-behavior: none; }
body { display: flex; justify-content: center; }
#app { position: relative; width: 100%; max-width: 440px; height: 100%; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 0%, #1f2e27 0%, var(--bg) 60%); user-select: none; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom)); }
.screen.on { display: flex; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.hud { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.chip b { color: var(--root); }
.chip.gold b { color: var(--gold); }
.spacer { flex: 1; }
h1 { font-size: 20px; margin: 4px 0; letter-spacing: -0.02em; }
h1.pick { cursor: pointer; }
h1.pick::after { content: ' ▾'; font-size: 13px; color: var(--dim); }
.sub { color: var(--dim); font-size: 13px; line-height: 1.5; }
.big-btn { width: 100%; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 700;
  background: linear-gradient(180deg, #7fe0cf, #4fb3a2); color: #08241f; box-shadow: 0 6px 0 #2d6e63; }
.big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2d6e63; }
.ghost-btn { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }

/* 홈: 기록 천 지도 */
#map { position: relative; flex: 1; min-height: 0; margin: 6px 0 10px; }
#map svg { width: 100%; height: 100%; overflow: visible; }
.node-label { font-size: 12px; fill: var(--text); text-anchor: middle; pointer-events: none; }
.node-cost { font-size: 11px; fill: var(--gold); text-anchor: middle; pointer-events: none; }
#idle { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
#idle .grow { flex: 1; }
/* 좁은 휴대전화(폭 360 이하)에서 홈 아래 버튼 줄이 두 줄로 꺾이지 않게 한다 */
@media (max-width: 360px) { #homeRow .ghost-btn { white-space: nowrap; padding: 10px 8px; font-size: 13px; } }
@media (max-width: 360px) { #hTitle { font-size: 17px; } }
@media (max-width: 340px) { #hTitle { font-size: 16px; letter-spacing: -0.04em; } }
.bar { height: 6px; background: #0b100d; border-radius: 4px; overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--root); width: 0; transition: width .3s; }

/* 낮: 스크린 */
#card { position: relative; margin: 12px 0; flex: 1; border-radius: 18px; border: 1px solid #3c6f66;
  background: linear-gradient(180deg, rgba(111,211,193,.10), rgba(111,211,193,.03)); padding: 18px 16px;
  display: flex; flex-direction: column; transition: transform .18s ease, opacity .18s ease; touch-action: none; }
#card .tag { font-size: 12px; color: var(--root); letter-spacing: .08em; }
#card .name { font-size: 26px; font-weight: 800; margin: 6px 0 2px; }
#card .glyph { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 84px; min-height: 0; padding: 6px 0; }
#card .glyph svg { width: 100%; height: 100%; max-width: 320px; max-height: 240px; border-radius: 12px;
  box-shadow: 0 0 0 1px #2c4a43, 0 8px 22px rgba(0,0,0,.45); transition: filter .25s, opacity .25s; }
#card .glyph .emoji { font-size: 84px; filter: drop-shadow(0 0 18px rgba(111,211,193,.35)); }
#card .glyph .trace { display: none; }
#card .glyph.traced .trace { display: inline; }
#card .glyph .trace * { fill: none; stroke: var(--sky); stroke-width: 1.6; opacity: 1; stroke-dasharray: 420; stroke-dashoffset: 420; animation: trace .38s ease-out forwards; }
#card .glyph.traced svg { filter: drop-shadow(0 0 8px rgba(143,211,245,.55)); }
#card .glyph.smudge svg { filter: blur(3px); opacity: .55; }
@keyframes trace { to { stroke-dashoffset: 0; } }
#card .clue { min-height: 40px; color: var(--dim); font-size: 13px; line-height: 1.5; }
#card .path { font-size: 12px; color: var(--root); min-height: 18px; }
.prompt { font-size: 14px; color: var(--text); margin-bottom: 8px; }
.timer { font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 800; text-align: center; color: var(--root); }
.timer.low { color: var(--red); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { min-height: 74px; border-radius: 14px; padding: 10px; font-size: 15px; font-weight: 700; line-height: 1.3;
  background: var(--panel); border: 1px solid #3c6f66; }
.choice:active { background: #24352d; }
.choice small { display: block; font-size: 11px; color: var(--dim); font-weight: 400; margin-top: 3px; }
.row { display: flex; gap: 8px; align-items: center; }
#combo { position: absolute; right: 14px; top: 12px; font-weight: 900; color: var(--gold); font-size: 18px; opacity: 0; transition: opacity .2s; }
.pop { position: absolute; pointer-events: none; font-weight: 900; font-size: 22px; animation: pop .9s ease-out forwards; z-index: 20; }
@keyframes pop { from { transform: translateY(0) scale(.7); opacity: 1; } to { transform: translateY(-60px) scale(1.2); opacity: 0; } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
.flash-ok { box-shadow: 0 0 0 2px var(--root), 0 0 28px rgba(111,211,193,.5) inset; }
.flash-bad { box-shadow: 0 0 0 2px var(--red), 0 0 28px rgba(224,82,79,.45) inset; }
.flash-blur { filter: blur(1.5px); opacity: .6; }
.coach { display: none; border-left: 3px solid var(--root); padding: 7px 10px; margin-bottom: 8px; background: rgba(111,211,193,.07);
  border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.55; min-height: 44px; }
.coach.on { display: block; }
.coach.warn { border-left-color: var(--red); background: rgba(224,82,79,.08); }
.tap-hint { text-align: center; color: var(--dim); font-size: 12px; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.screen-text { font-family: ui-monospace, "Cascadia Mono", monospace; color: var(--root); font-size: 14px; line-height: 1.7;
  border: 1px solid #3c6f66; border-radius: 10px; padding: 10px 12px; background: rgba(111,211,193,.06); }

/* 이야기 */
#story .scene { flex: 1; overflow: auto; font-size: 15px; line-height: 1.75; padding: 6px 2px; }
#story .scene p { margin: 0 0 12px; }
#story .scene .say { color: #fff; }
#story .opts { display: grid; gap: 10px; }
#story .opt { text-align: left; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 15px; }
#story .opt .hint { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; }
.lore { border-left: 3px solid var(--gold); padding: 8px 10px; background: rgba(227,196,107,.07); font-size: 14px; border-radius: 0 8px 8px 0; margin-top: 8px; }

/* 밤 */
#night canvas { flex: 1; width: 100%; border-radius: 16px; background: #090c0b; touch-action: none; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.tool { padding: 9px 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; line-height: 1.3; }
.tool small { display: block; color: var(--dim); font-size: 11px; }
.tool.armed { border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(242,214,75,.35) inset; }
.tool:disabled { opacity: .35; }
/* 기록 */
#codex .list { flex: 1; overflow: auto; }
.entry { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
.entry.locked { color: #56645b; border-style: dashed; }
.entry h4 { margin: 0 0 4px; font-size: 13px; color: var(--gold); }
.entry .alt { color: var(--dim); font-size: 13px; }
.modal { position: absolute; inset: 0; background: rgba(5,8,7,.78); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal.on { display: flex; }
.modal .box { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.modal .box h2 { margin: 0 0 6px; font-size: 19px; }
.stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.stat b { color: var(--root); }
</style>
</head>
<body>
<div id="app">

  <!-- 홈 -->
  <section id="home" class="screen on">
    <div class="hud">
      <span class="chip">실타래 <b id="hIeum">0</b></span>
      <span class="chip gold">기록 <b id="hLore">0/12</b></span>
      <span class="spacer"></span>
      <span class="chip">안정화율 <b id="hStab">0.003%</b></span>
    </div>
    <div class="row"><h1 id="hTitle" style="flex:1">기록 천 — 정착지</h1>
      <button class="ghost-btn" id="chBtn" style="display:none;padding:6px 10px;font-size:13px"></button></div>
    <div class="sub" id="hSub">빛나는 조각을 눌러 실타래로 기록을 연다. 고른 답이 세계 기록으로 남는다.</div>
    <div id="map"></div>
    <div id="idle">
      <div style="font-size:26px">🌳</div>
      <div class="grow">
        <div id="idleText">나무가 실타래를 모으는 중 <b id="idleRate" style="color:var(--root)">0</b>/시간</div>
        <div class="bar"><i id="idleBar"></i></div>
      </div>
      <button class="ghost-btn" id="collectBtn">받기 <b id="idleAmt">0</b></button>
    </div>
    <div class="row" id="homeRow" style="margin-bottom:10px">
      <button class="ghost-btn" id="codexBtn" style="flex:1">세계 기록</button>
      <button class="ghost-btn" id="streakBtn" style="flex:1">마루의 매듭 <b id="streak">0</b>일</button>
      <button class="ghost-btn" id="muteBtn" aria-label="소리 켜고 끄기">🔊</button>
      <button class="ghost-btn" id="installBtn" aria-label="휴대전화 홈 화면에 두기" title="휴대전화 홈 화면에 두기" style="display:none">📲</button>
    </div>
    <button class="ghost-btn" id="fixBtn" style="display:none;margin-bottom:10px"></button>
    <button class="big-btn" id="dayBtn">낮 — 분류 시작</button>
  </section>

  <!-- 낮 -->
  <section id="day" class="screen">
    <div class="hud">
      <span class="chip">실타래 <b id="dIeum">0</b></span>
      <span class="chip" style="color:var(--red)">붉은 줄 <b id="dRed" style="color:var(--red)">0</b></span>
      <span class="spacer"></span>
      <span class="chip"><b id="dCount">1/8</b></span>
    </div>
    <div id="card">
      <div id="combo"></div>
      <div class="tag" id="cTag">표본 01</div>
      <div class="name" id="cName">물</div>
      <div class="path" id="cPath"></div>
      <div class="glyph" id="cGlyph"></div>
      <div class="clue" id="cClue"></div>
    </div>
    <div class="coach" id="cCoach"></div>
    <div class="prompt" id="cPrompt">분류:</div>
    <div class="timer" id="cTimer">4.0</div>
    <div class="choices">
      <button class="choice" id="optL"></button>
      <button class="choice" id="optR"></button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost-btn" id="observeBtn" style="flex:1">단서 보기 (실타래 절반)</button>
      <button class="ghost-btn" id="lockBtn" style="flex:1">여기서 멈추기</button>
    </div>
  </section>

  <!-- 이야기 -->
  <section id="story" class="screen">
    <div class="hud"><span class="chip gold" id="sTitle">기록 조각</span><span class="spacer"></span>
      <button class="ghost-btn" id="sSkip" style="display:none;padding:5px 10px;font-size:12px">건너뛰기</button></div>
    <div class="scene" id="sScene"></div>
    <div class="opts" id="sOpts"></div>
  </section>

  <!-- 밤 -->
  <section id="night" class="screen">
    <div class="hud">
      <span class="chip">밤 <b id="nTime">20</b></span>
      <span class="chip">기록 천 <b id="nHp">♥♥♥</b></span>
      <span class="spacer"></span>
      <span class="chip">쫓아낸 해체자 <b id="nKill">0</b></span>
    </div>
    <div class="sub" id="nHint" style="margin:6px 0">사각거리는 해체자를 눌러 쫓아내라. 붉은 줄에 걸린 곳으로 먼저 몰려든다.</div>
    <canvas id="nCanvas"></canvas>
    <div class="tools" id="nTools">
      <button class="tool" id="tYarn" style="color:var(--yellow)">🧶 노란 실<small id="tYarnSub">실타래 12</small></button>
      <button class="tool" id="tCut">✂️ 끊기<small id="tCutSub">하룻밤 한 번</small></button>
      <button class="tool" id="tFix">🔒 고정<small id="tFixSub">서린의 손 0</small></button>
    </div>
  </section>

  <!-- 세계 기록 -->
  <section id="codex" class="screen">
    <div class="row"><h1 style="flex:1">세계 기록</h1><button class="ghost-btn" id="codexBack">닫기</button></div>
    <div class="sub" style="margin-bottom:10px">조각마다 선택지가 둘이다. 다른 답을 골라야 나머지 기록이 열린다.</div>
    <div class="list" id="codexList"></div>
  </section>

  <div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
</div>

<script>
'use strict';
// ───────────────────────── 데이터 ─────────────────────────
// 표본: 소설 1~9화의 스크린 + 지구 개체. answer는 0(왼쪽) 또는 1(오른쪽).
const SPECIMENS = [
  { id: 'water', name: '물', glyph: '💧', clue: '손끝에 묻으면 차갑다. 컵에 담을 수 있다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 1 },
    { o: ['손에 닿는 물질', '형태가 없는 현상'], a: 0 } ] },
  { id: 'heuindari', name: '미확인 생명', glyph: '🦌', clue: '흰 앞발. 등에 잎이 났다. 뿔에서 은빛 가루가 떨어진다.', steps: [
    { o: ['살아 있는 것', '만들어진 것'], a: 0 },
    { o: ['빛을 먹는 것', '다른 생명을 먹는 것'], a: 0 },
    { o: ['포자로 번식', '씨앗으로 번식'], a: 0, final: true } ] },
  { id: 'well', name: '줄어드는 우물물', glyph: '🪣', clue: '물이 아직 남았다. 수면의 흙가루가 옆으로 사라진다.', steps: [
    { o: ['지하수가 마른 것', '우물물이 새는 것'], a: 1 } ] },
  { id: 'leafbug', name: '낙엽 모양의 물체', glyph: '🍂', clue: '바람이 없는데도 낙엽 하나가 뿌리를 걸어 오른다.', steps: [
    { o: ['바람에 밀리는 낙엽', '스스로 걷는 생물'], a: 1 } ] },
  { id: 'mirrorhare', name: '거울토끼', glyph: '🐇', clue: '화분 조각을 디딘 앞발에서 소리가 나지 않았다.', deep: true, steps: [
    { o: ['살아 있는 생물', '빛이 만든 형상'], a: 0 },
    { o: ['소리를 먹는 것', '꿈을 먹는 것'], a: 1, final: true } ] },
  { id: 'cat', name: '고양이', glyph: '🐈', clue: '새끼에게 젖을 먹인다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['알을 낳는 것', '새끼를 낳는 것'], a: 1 } ] },
  { id: 'platypus', name: '오리너구리', glyph: '🦫', clue: '부리가 있다. 굴에서 새끼에게 젖을 먹인다.', deep: true, steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['알을 낳는 것', '새끼를 낳는 것'], a: 0 },
    { o: ['젖을 먹이는 것', '젖을 먹이지 않는 것'], a: 0, final: true } ] },
  { id: 'moss', name: '이끼', glyph: '🌿', clue: '젖은 돌에 붙어 자란다. 꽃이 피지 않는다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['빛을 먹는 것', '다른 생명을 먹는 것'], a: 0 },
    { o: ['포자로 번식', '씨앗으로 번식'], a: 0, final: true } ] },
  { id: 'salt', name: '소금', glyph: '🧂', clue: '물에 녹으면 보이지 않는다. 물을 끓여 날리면 다시 남는다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 1 },
    { o: ['손에 닿는 물질', '형태가 없는 현상'], a: 0 },
    { o: ['한 가지 원소', '여러 원소가 붙은 것'], a: 1, final: true } ] },
  { id: 'rainbow', name: '무지개', glyph: '🌈', clue: '비 갠 뒤 해를 등지면 보인다. 다가가면 멀어진다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 1 },
    { o: ['손에 닿는 물질', '형태가 없는 현상'], a: 1 } ] },
  { id: 'whale', name: '고래', glyph: '🐋', clue: '물속에 살지만 숨을 쉬러 올라온다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['물고기', '젖먹이 짐승'], a: 1 } ] },
  { id: 'bat', name: '박쥐', glyph: '🦇', clue: '날개가 있다. 새끼에게 젖을 먹인다.', steps: [
    { o: ['새', '젖먹이 짐승'], a: 1 } ] },
  { id: 'phone', name: '휴대전화', glyph: '📱', clue: '연우의 주머니에 있던 것. 날짜 자리에 ??만 뜬다.', steps: [
    { o: ['살아 있는 것', '만들어진 것'], a: 1 },
    { o: ['톱니로 움직이는 것', '전기로 움직이는 것'], a: 1 } ] },

function drawMap() {
  const W = 360, H = 360, cx = W / 2, cy = H / 2, R = 128, NODES = curNodes();
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  // 중심 나무에서 각 조각으로 줄
  NODES.forEach((n, i) => {
    const ang = -Math.PI / 2 + i * Math.PI * 2 / NODES.length;
    n.x = cx + Math.cos(ang) * R; n.y = cy + Math.sin(ang) * R;
    const open = S.nodes[n.id] != null, red = S.red[n.id] > 0;
    svg += `<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="${red ? 'var(--red)' : open ? 'var(--root)' : '#2f3f36'}" stroke-width="${red ? 2 + S.red[n.id] : 2}" stroke-dasharray="${open ? '' : '4 6'}"/>`;
  });
  // 조각과 조각을 잇는 실: 앞 조각이 열려 있으면 밝게
  NODES.forEach((n) => (n.after || []).forEach(id => {
    const p = NODES.find(m => m.id === id); if (!p) return;
    const lit = S.nodes[id] != null;
    svg += `<line x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="${lit ? 'var(--gold)' : '#2f3f36'}" stroke-width="${lit ? 2 : 1.5}" stroke-dasharray="${lit && S.nodes[n.id] != null ? '' : '2 5'}" opacity="${lit ? .8 : .6}"/>`;
  }));
  svg += `<circle cx="${cx}" cy="${cy}" r="34" fill="#16231d" stroke="var(--gold)" stroke-width="2"/>
    <text x="${cx}" y="${cy + 10}" font-size="30" text-anchor="middle">${curCh().center}</text>`;
  NODES.forEach((n) => {
    const open = S.nodes[n.id] != null, ready = nodeReady(n), afford = ready && S.ieum >= n.cost;
    const fill = open ? '#1e3a33' : afford ? '#2a2614' : '#141b17';
    const stroke = open ? 'var(--root)' : afford ? 'var(--gold)' : '#2f3f36';
    svg += `<g data-node="${n.id}" style="cursor:pointer">
      <circle cx="${n.x}" cy="${n.y}" r="30" fill="${fill}" stroke="${stroke}" stroke-width="${afford && !open ? 3 : 2}">
        ${afford && !open ? '<animate attributeName="r" values="29;33;29" dur="1.4s" repeatCount="indefinite"/>' : ''}</circle>
      <text x="${n.x}" y="${n.y + 8}" font-size="22" text-anchor="middle" opacity="${open || afford ? 1 : .35}">${n.icon}</text>
      <text class="node-label" x="${n.x}" y="${n.y + 46}">${n.name}</text>
      ${open ? '' : ready ? `<text class="node-cost" x="${n.x}" y="${n.y + 60}">실타래 ${n.cost}</text>`
        : `<text class="node-cost" x="${n.x}" y="${n.y + 60}" style="fill:var(--dim)">${needNames(n)} 다음</text>`}
    </g>`;
  });
  svg += '</svg>';
  $('map').innerHTML = svg;
  $('map').querySelectorAll('[data-node]').forEach(g => g.onclick = () => openNode(g.dataset.node));
}

function openNode(id) {
  const n = curNodes().find(x => x.id === id);
  const open = S.nodes[id] != null;
  const both = (S.lore[id] || []).length >= 2;
  if (both) { show('codex'); renderCodex(); return; }
  if (!open && !nodeReady(n)) {
    modal(`<h2>${n.name}</h2><div class="sub">이 조각은 ${needNames(n)} 조각에서 이어진다. 그 조각을 먼저 열자.</div>`, [['확인']]);
    return;
  }
  if (!open && S.ieum < n.cost) {
    modal(`<h2>${n.name}</h2><div class="sub">실타래가 ${n.cost - Math.floor(S.ieum)} 모자란다. 낮에 분류하거나 나무에서 받아 오자.</div>`, [['확인']]);
    return;
  }
  const replayCost = Math.ceil(n.cost * 1.5);
  if (open) {
    if (S.ieum < replayCost) {
      modal(`<h2>${n.name} — 다른 선택지</h2><div class="sub">다른 답을 고르려면 실타래가 ${replayCost} 필요하다.</div>`, [['확인']]);
      return;
    }
    modal(`<h2>${n.name} — 다른 선택지</h2><div class="sub">이 장면을 다시 열고 아직 고르지 않은 답을 고른다. (실타래 ${replayCost})</div>`,
      [['다시 열기', () => { S.ieum -= replayCost; playStory(n, true); }, true], ['그만두기']]);
    return;
  }
  S.ieum -= n.cost; playStory(n, false);
}

function tapScene(title, lines, onEnd) {  // 탭할 때마다 한 문단씩, 다 보이면 onEnd

}
function chooseStory(n, k) {

  if (r.idle) { S.idle += r.idle; gain = `나무가 모으는 실타래 +${r.idle * BAL.idlePerHour}/시간`; }
  if (r.slow) { S.slow += r.slow; gain = '밤에 해체자가 느려진다'; }
  if (r.hp) { S.hpBonus += r.hp; gain = '기록 천 +1'; }

  $('sOpts').innerHTML = '';
  const div = document.createElement('div'); div.className = 'lore';

function renderCodex() {
  $('codexList').innerHTML = CHAPTERS.slice(0, S.unlocked + 1).map(ch =>
    `<h4 style="color:var(--dim);margin:12px 0 6px">${ch.name} · ${loreCount(ch)}/${ch.nodes.length * 2}</h4>` + ch.nodes.slice().sort((a, b) => a.cost - b.cost).map(n => {
    const taken = S.lore[n.id] || [];
    if (!taken.length) return `<div class="entry locked"><h4>${n.icon} ${n.name}</h4>아직 열지 않은 조각</div>`;

      n.opts.map((o, k) => taken.includes(k) ? `<div>${o.lore}</div>` : `<div class="alt">— 고르지 않은 선택지 —</div>`).join('') + '</div>';

}
$('codexBtn').onclick = () => { renderCodex(); show('codex'); };
$('codexBack').onclick = () => { show('home'); renderHome(); };
$('streakBtn').onclick = () => modal(`<h2>마루의 매듭</h2><div class="sub">하루에 한 번 낮을 마치면 마루가 매듭을 하나 짓는다. 매듭이 이어질수록 아침에 받는 실타래가 늘어난다.<br><br>지금 매듭: ${S.streak}개</div>`, [['확인']]);

// ───────────────────────── 낮: 분류 ─────────────────────────
const DAY_CARDS = 8;
let D = null, timerId = null;
function startDay(tutorial) {
  const pool = SPECIMENS.slice();
  // 붉은 줄이 남은 표본을 먼저 다시 낸다(틀린 것을 배워 고치기)
  const retry = pool.filter(s => S.red['sp_' + s.id]);
  const rest = pool.filter(s => !S.red['sp_' + s.id]).sort(() => Math.random() - .5);
  let deck = tutorial === true
    ? Object.keys(TUTORIAL).map(id => pool.find(s => s.id === id))
    : retry.concat(rest).slice(0, DAY_CARDS).sort(() => Math.random() - .5);
  // 고정된 볕마을은 같은 하루를 되풀이한다: 붙잡은 첫날의 표본이 같은 순서로 다시 나온다
  if (tutorial !== true && fixedHere()) {
    const same = (S.sameDay || []).map(id => pool.find(s => s.id === id)).filter(Boolean);
    if (same.length === DAY_CARDS) deck = same; else { S.sameDay = deck.map(s => s.id); save(); }
  }
  D = { deck, idx: 0, step: 0, earned: 0, red: 0, blur: 0, combo: 0, maxCombo: 0, observed: false, correct: 0, path: [],
    tutorial: tutorial === true, waiting: false };
  $('cCoach').classList.toggle('on', D.tutorial);
  $('lockBtn').style.display = D.tutorial ? 'none' : '';
  show('day'); nextCard();
}
function coach(html, warn) { $('cCoach').innerHTML = html; $('cCoach').classList.toggle('warn', !!warn); }
function cardTime(sp) { return sp.deep ? 2.0 : 4.0; }  // 깊은 표본은 튜토리얼 뒤의 2.0
function nextCard() {
  if (D.idx >= D.deck.length) return endDay();
  const sp = D.deck[D.idx]; D.step = 0; D.observed = false; D.path = [];
  $('cTag').textContent = '표본 ' + String(D.idx + 1).padStart(2, '0');
  $('cName').textContent = sp.name;
  $('cGlyph').className = 'glyph'; $('cGlyph').innerHTML = artOf(sp);
  $('cClue').textContent = ''; $('cPath').textContent = '';
  $('dCount').textContent = (D.idx + 1) + '/' + D.deck.length;
  $('observeBtn').disabled = false; $('observeBtn').style.opacity = 1;
  $('observeBtn').style.display = D.tutorial && sp.id === 'water' ? 'none' : '';  // 단서 보기는 둘째 표본에서 가르친다
  $('card').style.opacity = 0; $('card').style.transform = 'translateY(14px)';
  requestAnimationFrame(() => { $('card').style.opacity = 1; $('card').style.transform = ''; });
  showStep();
}
function showStep() {
  const sp = D.deck[D.idx], st = sp.steps[D.step];
  $('cPrompt').textContent = st.final ? '최종 분류:' : '분류:';
  $('optL').innerHTML = st.o[0]; $('optR').innerHTML = st.o[1];
  $('lockBtn').disabled = D.step === 0; $('lockBtn').style.opacity = D.step === 0 ? .4 : 1;
  $('dIeum').textContent = fmt(S.ieum + D.earned); $('dRed').textContent = D.red;
  if (D.tutorial) coach(TUTORIAL[sp.id].steps[D.step]);
  startTimer(cardTime(sp));
}
function startTimer(t) {
  clearInterval(timerId);
  const end = performance.now() + t * 1000;
  D.tLimit = t;
  const tick = () => {
    const left = Math.max(0, (end - performance.now()) / 1000);
    D.tLeft = left;
    $('cTimer').textContent = left.toFixed(1);
    $('cTimer').classList.toggle('low', left < 1.0);
    const half = Math.ceil(left * 2);  // 마지막 1초는 0.5초마다 똑딱
    if (left < 1.0 && half !== D.lastTick) { D.lastTick = half; SFX.tick(); }
    if (left <= 0) {
      clearInterval(timerId);
      if (D.tutorial) { timerId = null; D.waiting = true; coach(TUT_WAIT); }  // 첫 판은 시간 초과로 벌하지 않는다
      else timeout();
    }
  };
  tick(); timerId = setInterval(tick, 50);
}
function stepValue() {  // 깊이 내려갈수록, 빨리 고를수록 크게
  const base = 3 + D.step * 3;
  const speed = 1 + (D.tLeft / D.tLimit);
  const mult = 1 + Math.min(D.combo, 10) * 0.25;
  return Math.round(base * speed * mult * (D.observed ? .5 : 1));
}
function choose(side, ev) {
  if (!D || (timerId == null && !D.waiting)) return;
  clearInterval(timerId); timerId = null; D.waiting = false;
  const sp = D.deck[D.idx], st = sp.steps[D.step];
  const x = ev ? ev.clientX : innerWidth / 2, y = ev ? ev.clientY : innerHeight / 2;
  if (D.tutorial && side !== st.a) {  // 첫 판의 오답: 붉은 줄을 보여 주고 같은 단계를 다시 고르게 한다
    D.combo = 0; showCombo();
    pop('붉은 줄', 'var(--red)', x, y - 20);
    flash('flash-bad'); $('card').classList.add('shake'); setTimeout(() => $('card').classList.remove('shake'), 300);
    buzz([30, 30, 60]); SFX.bad(); coach(TUT_WRONG, true);
    setTimeout(() => startTimer(cardTime(sp)), 500);
    return;
  }
  if (side === st.a) {
    D.combo++; D.maxCombo = Math.max(D.maxCombo, D.combo);
    const v = stepValue(); D.earned += v;
    D.path.push(st.o[side]); $('cPath').textContent = D.path.join(' › ');
    pop('+' + v, 'var(--root)', x, y - 20);
    flash('flash-ok'); buzz(12); showCombo();
    D.step++;
    if (D.step >= sp.steps.length) { SFX.bigOk(D.combo); finishCard(true); }
    else { SFX.ok(D.combo); setTimeout(showStep, 220); }
  } else {
    D.combo = 0; D.red++;
    S.red['sp_' + sp.id] = (S.red['sp_' + sp.id] || 0) + 1 + D.step;  // 깊이 욕심낸 오답일수록 굵은 줄
    pop('붉은 줄', 'var(--red)', x, y - 20);
    flash('flash-bad'); $('card').classList.add('shake'); setTimeout(() => $('card').classList.remove('shake'), 300);
    buzz([30, 30, 60]); SFX.bad(); showCombo();
    finishCard(false);
  }
}
function timeout() {
  // 시간이 다 되면 정답도 오답도 아닌 시간 초과로 남는다
  timerId = null; D.combo = 0; D.blur++;
  $('cGlyph').classList.add('smudge');  // 스크린은 번진 채 대상 위에 남는다
  flash('flash-blur'); SFX.blur(); pop('시간 초과', 'var(--dim)', innerWidth / 2, innerHeight / 2);
  finishCard(false);
}
function finishCard(ok) {
  const sp = D.deck[D.idx];
  if (ok) {
    D.correct++; $('cGlyph').classList.add('traced');  // 맞히면 하늘색 선이 대상을 따라 뻗는다
    if (S.red['sp_' + sp.id]) { delete S.red['sp_' + sp.id]; pop('붉은 줄이 풀렸다', 'var(--gold)', innerWidth / 2, innerHeight / 3); }
  }
  D.idx++;
  if (D.tutorial && ok) { setTimeout(() => modal(TUTORIAL[sp.id].done, [['계속', nextCard, true]]), 420); return; }
  setTimeout(nextCard, ok ? 420 : 650);
}
function lockHere(ev) {  // 한 단계 이상 맞힌 뒤 여기서 멈추기: 안전하게 마무리
  if (D.step === 0 || timerId == null) return;
  clearInterval(timerId); timerId = null;
  pop('멈춤', 'var(--gold)', ev.clientX, ev.clientY - 20); buzz(10); SFX.lock();
  finishCard(true);
}
function showCombo() {
  const c = $('combo');
  if (D.combo >= 2) { c.textContent = '연속 ' + D.combo + ' ×' + (1 + Math.min(D.combo, 10) * 0.25).toFixed(2); c.style.opacity = 1; }
  else c.style.opacity = 0;
}
function flash(cls) { const c = $('card'); c.classList.add(cls); setTimeout(() => c.classList.remove(cls), 260); }
$('optL').onclick = (e) => choose(0, e);
$('optR').onclick = (e) => choose(1, e);
$('lockBtn').onclick = lockHere;
$('observeBtn').onclick = () => {
  if (D.observed) return; D.observed = true;

    ctx.strokeStyle = '#c9c3b6'; ctx.lineWidth = 1.4;
    const tt = frozen ? N.freeze - FIX_DUR : N.t;
    for (let k = 0; k < 6; k++) {
      const a = k + tt * 4 + f.wob; ctx.beginPath();
      ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + Math.cos(a) * 9, f.y + Math.sin(a * 1.3) * 9); ctx.stroke();
    }
    ctx.fillStyle = '#e8e2d4'; ctx.beginPath(); ctx.arc(f.x, f.y, 4.5, 0, Math.PI * 2); ctx.fill();
  });
  N.parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); });
  ctx.globalAlpha = 1;
  if (frozen) { ctx.fillStyle = 'rgba(227,196,107,.08)'; ctx.fillRect(0, 0, W, H); }
}
function dawnHand() {  // 새벽마다 서린의 손이 조금 풀린다. 볕마을을 붙잡고 있으면 풀리지 않는다
  if (S.fixed || S.stiff) return false;
  S.hand = Math.max(0, S.hand - HAND_DAWN); return true;
}
function handStat() {
  if (!TOOLS[2].ok() || (!S.hand && !S.stiff)) return '';
  return `<div class="stat"><span>서린의 손</span><b style="color:var(--yellow)">${S.stiff ? '굳음 · 남은 밤 ' + S.stiff : Math.round(S.hand) + (S.fixed ? ' (볕마을을 붙잡고 있다)' : '')}</b></div>`;
}
function endNight() {
  N.over = true; N.armed = null;
  const lostNames = N.cuts, kept = N.hp > 0;
  const morning = 5 + Math.min(S.streak, 7) * 2;  // 마루의 매듭 보너스
  S.ieum += morning;
  // 첫 새벽에는 첫 조각을 반드시 열 수 있게 나무가 모자란 만큼 채운다
  const gift = S.onboarded ? 0 : Math.max(0, SETTLE_NODES[0].cost - Math.floor(S.ieum));
  S.ieum += gift;
  // 고정한 밤에는 지켜도 안정화율이 오르지 않는다(자라나는 것이 멈춘다)
  const keptGain = kept ? (N.fixUsed ? 0 : 0.002) : -0.002;
  S.stab = Math.max(0, S.stab + keptGain - lostNames * 0.0005);
  curNodes().forEach(n => { S.red[n.id] = 0; });
  dawnHand();
  save();
  SFX.amb(ambFor('home'));  // 새벽이 오면 밤의 울림이 걷힌다
  SFX.dawn(kept);
  const result = kept ? (lostNames ? '기록 천은 지켰다. 끊긴 줄이 있다.' : '한 줄도 끊기지 않았다.') : '기록 천이 찢겼다. 그래도 아침은 온다.';
  const buttons = [['아침으로', goHome, true]];
  // 첫 5분에는 광고를 권하지 않는다
  if (S.onboarded) buttons.unshift(['광고 보고 아침 보상 두 배 (시험용: 바로 지급)', () => { S.ieum += morning; save(); goHome(); }]);
  modal(`<h2>새벽</h2><div class="sub">${result}${N.fixUsed && kept ? '<br>붙잡은 밤이었다. 안정화율은 오르지 않았다.' : ''}</div>
    <div class="stat"><span>쫓아낸 해체자</span><b>${N.kills}</b></div>
    <div class="stat"><span>끊긴 줄</span><b style="color:var(--red)">${lostNames}</b></div>
    <div class="stat"><span>마루의 매듭 보너스</span><b>실타래 +${morning}</b></div>
    ${gift ? `<div class="stat"><span>나무 수확</span><b>+${gift}</b></div>` : ''}
    ${handStat()}
    <div class="stat"><span>영역 안정화율</span><b>${S.stab.toFixed(3)}%</b></div>`, buttons);
}
function fixedDawn() {  // 고정된 볕마을: 밤 없이 아침. 매듭 보너스는 받지만 안정화율은 그대로다
  const morning = 5 + Math.min(S.streak, 7) * 2;
  S.ieum += morning; save();
  SFX.dawn(true);
  modal(`<h2>밤 없는 저녁</h2><div class="sub">바깥에는 밤이 왔다. 볕마을 안은 늦은 오후 그대로였다. 주민들은 저녁이라며 잠들었다.<br>기록 천은 한 올도 변하지 않았다.</div>
    <div class="stat"><span>마루의 매듭 보너스</span><b>실타래 +${morning}</b></div>
    ${handStat()}
    <div class="stat"><span>영역 안정화율</span><b>${S.stab.toFixed(3)}% (그대로)</b></div>`,
    [['광고 보고 아침 보상 두 배 (시험용: 바로 지급)', () => { S.ieum += morning; save(); goHome(); }], ['아침으로', goHome, true]]);
}
function goHome() {
  show('home'); renderHome(); tickIdle(); PWA.render();
  if (!S.onboarded) {
    S.onboarded = true; save(); syncAmb();
    modal(`<h2>기록 천</h2><div class="sub">모은 실타래로 기록 천의 조각을 연다. 조각마다 선택지가 둘이고, 고른 쪽이 이 세계의 기록으로 남는다.<br><br>빛나는 <b style="color:var(--gold)">우물</b>을 눌러 보자.</div>`, [['확인', null, true]]);
  }
}

$('dayBtn').onclick = () => startDay(false);

// ───────────────────────── 앱으로 두기(PWA) ─────────────────────────
// 서비스 워커가 게임 파일을 저장해 두어, 한 번 연 뒤에는 인터넷 없이도 돌아간다.
// 홈 화면에 둔 앱으로 열면 저장(localStorage)이 지워지지 않게 브라우저에 부탁한다.
const PWA = (() => {
  let deferred = null;
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const ios = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // 첫 판을 마치기 전에는 권하지 않는다. 버튼만 보이고, 저절로 뜨는 창은 없다
  const render = () => {
    const can = !standalone() && S.onboarded && (deferred || ios());
    $('installBtn').style.display = can ? '' : 'none';
  };
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; render(); });
  window.addEventListener('appinstalled', () => { deferred = null; render(); });
  if (standalone() && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  $('installBtn').onclick = () => {
    if (deferred) { const d = deferred; deferred = null; d.prompt(); d.userChoice.finally(render); return; }
    modal(`<h2>홈 화면에 두기</h2><div class="sub">브라우저의 공유 버튼을 누르고 <b>‘홈 화면에 추가’</b>를 고르면 된다.<br>홈 화면의 THE ROOT로 열면 기록이 브라우저 정리에 잘 지워지지 않고, 인터넷이 없어도 이어서 할 수 있다.</div>`, [['확인', null, true]]);
  };
  return { render, standalone };
})();
const renderMute = () => { $('muteBtn').textContent = S.mute ? '🔇' : '🔊'; };
$('muteBtn').onclick = () => { S.mute = !S.mute; save(); renderMute(); SFX.muted(); SFX.coin(); };
renderMute();
renderHome(); tickIdle(); PWA.render();
// 첫 실행: 1화 장면으로 바로 들어간다. v0.1 저장(seen)이 있으면 건너뛴다.
if (S.seen && !S.onboarded) { S.onboarded = true; save(); }
function startTutorial() {
  $('sSkip').style.display = 'none';
  modal(`<h2>표본 01 — 물</h2><div class="sub">스크린은 연우에게만 보인다. 둘 중 하나를 눌러라. 맞히면 <b style="color:var(--root)">실타래</b>가 모인다.<br>버튼 대신 카드를 좌우로 밀어도 된다.</div>`,
    [['분류한다', () => startDay(true), true]]);
}
if (!S.onboarded) {
  S.seen = true; save();
  $('sSkip').style.display = '';
  $('sSkip').onclick = (e) => { e.stopPropagation(); $('story').onclick = null; startTutorial(); };
  tapScene('1화 — 부수고 싶은 밤', PROLOGUE, () => {
    const b = document.createElement('button'); b.className = 'big-btn'; b.textContent = '표본 01 — 물';
    b.onclick = startTutorial; $('sOpts').appendChild(b);
  });
}
</script>
