<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<title>THE ROOT 모바일</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="THE ROOT">
<style>
:root {
  --bg: #0f1512;
  --bg2: #17201b;
  --panel: #1d2822;
  --line: #2f3f36;
  --text: #e9efe7;
  --dim: #9aaa9f;
  --root: #6fd3c1;      /* 실타래, 스크린 */
  --gold: #e3c46b;      /* 기록, 보상 */
  --yellow: #f2d64b;    /* 서린의 노란 실 */
  --red: #e0524f;       /* 붉은 줄 */
  --blue: #5d8fe0;      /* 마루의 파란 헝겊 */
  --undo: #c9c3b6;      /* 해체자 */
  --sky: #8fd3f5;       /* 하늘색 선: 정답과 복원 */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; overscroll-behavior: none; }
body { display: flex; justify-content: center; }
#app { position: relative; width: 100%; max-width: 440px; height: 100%; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 0%, #1f2e27 0%, var(--bg) 60%); user-select: none; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom)); }
.screen.on { display: flex; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.hud { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.chip b { color: var(--root); }
.chip.gold b { color: var(--gold); }
.spacer { flex: 1; }
h1 { font-size: 20px; margin: 4px 0; letter-spacing: -0.02em; }
h1.pick { cursor: pointer; }
h1.pick::after { content: ' ▾'; font-size: 13px; color: var(--dim); }
.sub { color: var(--dim); font-size: 13px; line-height: 1.5; }
.big-btn { width: 100%; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 700;
  background: linear-gradient(180deg, #7fe0cf, #4fb3a2); color: #08241f; box-shadow: 0 6px 0 #2d6e63; }
.big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2d6e63; }
.ghost-btn { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }

/* 홈: 기록 천 지도 */
#map { position: relative; flex: 1; min-height: 0; margin: 6px 0 10px; }
#map svg { width: 100%; height: 100%; overflow: visible; }
.node-label { font-size: 12px; fill: var(--text); text-anchor: middle; pointer-events: none; }
.node-cost { font-size: 11px; fill: var(--gold); text-anchor: middle; pointer-events: none; }
#idle { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
#idle .grow { flex: 1; }
/* 좁은 휴대전화(폭 360 이하)에서 홈 아래 버튼 줄이 두 줄로 꺾이지 않게 한다 */
@media (max-width: 360px) { #homeRow .ghost-btn { white-space: nowrap; padding: 10px 8px; font-size: 13px; } }
@media (max-width: 360px) { #hTitle { font-size: 17px; } }
@media (max-width: 340px) { #hTitle { font-size: 16px; letter-spacing: -0.04em; } }
.bar { height: 6px; background: #0b100d; border-radius: 4px; overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--root); width: 0; transition: width .3s; }

/* 낮: 스크린 */
#card { position: relative; margin: 12px 0; flex: 1; border-radius: 18px; border: 1px solid #3c6f66;
  background: linear-gradient(180deg, rgba(111,211,193,.10), rgba(111,211,193,.03)); padding: 18px 16px;
  display: flex; flex-direction: column; transition: transform .18s ease, opacity .18s ease; touch-action: none; }
#card .tag { font-size: 12px; color: var(--root); letter-spacing: .08em; }
#card .name { font-size: 26px; font-weight: 800; margin: 6px 0 2px; }
#card .glyph { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 84px; min-height: 0; padding: 6px 0; }
#card .glyph svg { width: 100%; height: 100%; max-width: 320px; max-height: 240px; border-radius: 12px;
  box-shadow: 0 0 0 1px #2c4a43, 0 8px 22px rgba(0,0,0,.45); transition: filter .25s, opacity .25s; }
#card .glyph .emoji { font-size: 84px; filter: drop-shadow(0 0 18px rgba(111,211,193,.35)); }
#card .glyph .trace { display: none; }
#card .glyph.traced .trace { display: inline; }
#card .glyph .trace * { fill: none; stroke: var(--sky); stroke-width: 1.6; opacity: 1; stroke-dasharray: 420; stroke-dashoffset: 420; animation: trace .38s ease-out forwards; }
#card .glyph.traced svg { filter: drop-shadow(0 0 8px rgba(143,211,245,.55)); }
#card .glyph.smudge svg { filter: blur(3px); opacity: .55; }
@keyframes trace { to { stroke-dashoffset: 0; } }
#card .clue { min-height: 40px; color: var(--dim); font-size: 13px; line-height: 1.5; }
#card .path { font-size: 12px; color: var(--root); min-height: 18px; }
.prompt { font-size: 14px; color: var(--text); margin-bottom: 8px; }
.timer { font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 800; text-align: center; color: var(--root); }
.timer.low { color: var(--red); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { min-height: 74px; border-radius: 14px; padding: 10px; font-size: 15px; font-weight: 700; line-height: 1.3;
  background: var(--panel); border: 1px solid #3c6f66; }
.choice:active { background: #24352d; }
.choice small { display: block; font-size: 11px; color: var(--dim); font-weight: 400; margin-top: 3px; }
.row { display: flex; gap: 8px; align-items: center; }
#combo { position: absolute; right: 14px; top: 12px; font-weight: 900; color: var(--gold); font-size: 18px; opacity: 0; transition: opacity .2s; }
.pop { position: absolute; pointer-events: none; font-weight: 900; font-size: 22px; animation: pop .9s ease-out forwards; z-index: 20; }
@keyframes pop { from { transform: translateY(0) scale(.7); opacity: 1; } to { transform: translateY(-60px) scale(1.2); opacity: 0; } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
.flash-ok { box-shadow: 0 0 0 2px var(--root), 0 0 28px rgba(111,211,193,.5) inset; }
.flash-bad { box-shadow: 0 0 0 2px var(--red), 0 0 28px rgba(224,82,79,.45) inset; }
.flash-blur { filter: blur(1.5px); opacity: .6; }
.coach { display: none; border-left: 3px solid var(--root); padding: 7px 10px; margin-bottom: 8px; background: rgba(111,211,193,.07);
  border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.55; min-height: 44px; }
.coach.on { display: block; }
.coach.warn { border-left-color: var(--red); background: rgba(224,82,79,.08); }
.tap-hint { text-align: center; color: var(--dim); font-size: 12px; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.screen-text { font-family: ui-monospace, "Cascadia Mono", monospace; color: var(--root); font-size: 14px; line-height: 1.7;
  border: 1px solid #3c6f66; border-radius: 10px; padding: 10px 12px; background: rgba(111,211,193,.06); }

/* 이야기 */
#story .scene { flex: 1; overflow: auto; font-size: 15px; line-height: 1.75; padding: 6px 2px; }
#story .scene p { margin: 0 0 12px; }
#story .scene .say { color: #fff; }
#story .opts { display: grid; gap: 10px; }
#story .opt { text-align: left; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 15px; }
#story .opt .hint { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; }
.lore { border-left: 3px solid var(--gold); padding: 8px 10px; background: rgba(227,196,107,.07); font-size: 14px; border-radius: 0 8px 8px 0; margin-top: 8px; }

/* 밤 */
#night canvas { flex: 1; width: 100%; border-radius: 16px; background: #090c0b; touch-action: none; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.tool { padding: 9px 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; line-height: 1.3; }
.tool small { display: block; color: var(--dim); font-size: 11px; }
.tool.armed { border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(242,214,75,.35) inset; }
.tool:disabled { opacity: .35; }
/* 기록 */
#codex .list { flex: 1; overflow: auto; }
.entry { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
.entry.locked { color: #56645b; border-style: dashed; }
.entry h4 { margin: 0 0 4px; font-size: 13px; color: var(--gold); }
.entry .alt { color: var(--dim); font-size: 13px; }
.modal { position: absolute; inset: 0; background: rgba(5,8,7,.78); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal.on { display: flex; }
.modal .box { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.modal .box h2 { margin: 0 0 6px; font-size: 19px; }
.stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.stat b { color: var(--root); }
</style>
</head>
<body>
<div id="app">

  <!-- 홈 -->
  <section id="home" class="screen on">
    <div class="hud">
      <span class="chip">실타래 <b id="hIeum">0</b></span>
      <span class="chip gold">기록 <b id="hLore">0/12</b></span>
      <span class="spacer"></span>
      <span class="chip">안정화율 <b id="hStab">0.003%</b></span>
    </div>
    <div class="row"><h1 id="hTitle" style="flex:1">기록 천 — 정착지</h1>
      <button class="ghost-btn" id="chBtn" style="display:none;padding:6px 10px;font-size:13px"></button></div>
    <div class="sub" id="hSub">빛나는 조각을 눌러 실타래로 기록을 연다. 고른 답이 세계 기록으로 남는다.</div>
    <div id="map"></div>
    <div id="idle">
      <div style="font-size:26px">🌳</div>
      <div class="grow">
        <div id="idleText">나무가 실타래를 모으는 중 <b id="idleRate" style="color:var(--root)">0</b>/시간</div>
        <div class="bar"><i id="idleBar"></i></div>
      </div>
      <button class="ghost-btn" id="collectBtn">받기 <b id="idleAmt">0</b></button>
    </div>
    <div class="row" id="homeRow" style="margin-bottom:10px">
      <button class="ghost-btn" id="codexBtn" style="flex:1">세계 기록</button>
      <button class="ghost-btn" id="streakBtn" style="flex:1">마루의 매듭 <b id="streak">0</b>일</button>
      <button class="ghost-btn" id="muteBtn" aria-label="소리 켜고 끄기">🔊</button>
      <button class="ghost-btn" id="installBtn" aria-label="휴대전화 홈 화면에 두기" title="휴대전화 홈 화면에 두기" style="display:none">📲</button>
    </div>
    <button class="ghost-btn" id="fixBtn" style="display:none;margin-bottom:10px"></button>
    <button class="big-btn" id="dayBtn">낮 — 분류 시작</button>
  </section>

  <!-- 낮 -->
  <section id="day" class="screen">
    <div class="hud">
      <span class="chip">실타래 <b id="dIeum">0</b></span>
      <span class="chip" style="color:var(--red)">붉은 줄 <b id="dRed" style="color:var(--red)">0</b></span>
      <span class="spacer"></span>
      <span class="chip"><b id="dCount">1/8</b></span>
    </div>
    <div id="card">
      <div id="combo"></div>
      <div class="tag" id="cTag">표본 01</div>
      <div class="name" id="cName">물</div>
      <div class="path" id="cPath"></div>
      <div class="glyph" id="cGlyph"></div>
      <div class="clue" id="cClue"></div>
    </div>
    <div class="coach" id="cCoach"></div>
    <div class="prompt" id="cPrompt">분류:</div>
    <div class="timer" id="cTimer">4.0</div>
    <div class="choices">
      <button class="choice" id="optL"></button>
      <button class="choice" id="optR"></button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost-btn" id="observeBtn" style="flex:1">단서 보기 (실타래 절반)</button>
      <button class="ghost-btn" id="lockBtn" style="flex:1">여기서 멈추기</button>
    </div>
  </section>

  <!-- 이야기 -->
  <section id="story" class="screen">
    <div class="hud"><span class="chip gold" id="sTitle">기록 조각</span><span class="spacer"></span>
      <button class="ghost-btn" id="sSkip" style="display:none;padding:5px 10px;font-size:12px">건너뛰기</button></div>
    <div class="scene" id="sScene"></div>
    <div class="opts" id="sOpts"></div>
  </section>

  <!-- 밤 -->
  <section id="night" class="screen">
    <div class="hud">
      <span class="chip">밤 <b id="nTime">20</b></span>
      <span class="chip">기록 천 <b id="nHp">♥♥♥</b></span>
      <span class="spacer"></span>
      <span class="chip">쫓아낸 해체자 <b id="nKill">0</b></span>
    </div>
    <div class="sub" id="nHint" style="margin:6px 0">사각거리는 해체자를 눌러 쫓아내라. 붉은 줄에 걸린 곳으로 먼저 몰려든다.</div>
    <canvas id="nCanvas"></canvas>
    <div class="tools" id="nTools">
      <button class="tool" id="tYarn" style="color:var(--yellow)">🧶 노란 실<small id="tYarnSub">실타래 12</small></button>
      <button class="tool" id="tCut">✂️ 끊기<small id="tCutSub">하룻밤 한 번</small></button>
      <button class="tool" id="tFix">🔒 고정<small id="tFixSub">서린의 손 0</small></button>
    </div>
  </section>

  <!-- 세계 기록 -->
  <section id="codex" class="screen">
    <div class="row"><h1 style="flex:1">세계 기록</h1><button class="ghost-btn" id="codexBack">닫기</button></div>
    <div class="sub" style="margin-bottom:10px">조각마다 선택지가 둘이다. 다른 답을 골라야 나머지 기록이 열린다.</div>
    <div class="list" id="codexList"></div>
  </section>

  <div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
</div>

<script>
'use strict';
// ───────────────────────── 데이터 ─────────────────────────
// 표본: 소설 1~9화의 스크린 + 지구 개체. answer는 0(왼쪽) 또는 1(오른쪽).
const SPECIMENS = [
  { id: 'water', name: '물', glyph: '💧', clue: '손끝에 묻으면 차갑다. 컵에 담을 수 있다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 1 },
    { o: ['손에 닿는 물질', '형태가 없는 현상'], a: 0 } ] },
  { id: 'heuindari', name: '미확인 생명', glyph: '🦌', clue: '흰 앞발. 등에 잎이 났다. 뿔에서 은빛 가루가 떨어진다.', steps: [
    { o: ['살아 있는 것', '만들어진 것'], a: 0 },
    { o: ['빛을 먹는 것', '다른 생명을 먹는 것'], a: 0 },
    { o: ['포자로 번식', '씨앗으로 번식'], a: 0, final: true } ] },
  { id: 'well', name: '줄어드는 우물물', glyph: '🪣', clue: '물이 아직 남았다. 수면의 흙가루가 옆으로 사라진다.', steps: [
    { o: ['지하수가 마른 것', '우물물이 새는 것'], a: 1 } ] },
  { id: 'leafbug', name: '낙엽 모양의 물체', glyph: '🍂', clue: '바람이 없는데도 낙엽 하나가 뿌리를 걸어 오른다.', steps: [
    { o: ['바람에 밀리는 낙엽', '스스로 걷는 생물'], a: 1 } ] },
  { id: 'mirrorhare', name: '거울토끼', glyph: '🐇', clue: '화분 조각을 디딘 앞발에서 소리가 나지 않았다.', deep: true, steps: [
    { o: ['살아 있는 생물', '빛이 만든 형상'], a: 0 },
    { o: ['소리를 먹는 것', '꿈을 먹는 것'], a: 1, final: true } ] },
  { id: 'cat', name: '고양이', glyph: '🐈', clue: '새끼에게 젖을 먹인다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['알을 낳는 것', '새끼를 낳는 것'], a: 1 } ] },
  { id: 'platypus', name: '오리너구리', glyph: '🦫', clue: '부리가 있다. 굴에서 새끼에게 젖을 먹인다.', deep: true, steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['알을 낳는 것', '새끼를 낳는 것'], a: 0 },
    { o: ['젖을 먹이는 것', '젖을 먹이지 않는 것'], a: 0, final: true } ] },
  { id: 'moss', name: '이끼', glyph: '🌿', clue: '젖은 돌에 붙어 자란다. 꽃이 피지 않는다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['빛을 먹는 것', '다른 생명을 먹는 것'], a: 0 },
    { o: ['포자로 번식', '씨앗으로 번식'], a: 0, final: true } ] },
  { id: 'salt', name: '소금', glyph: '🧂', clue: '물에 녹으면 보이지 않는다. 물을 끓여 날리면 다시 남는다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 1 },
    { o: ['손에 닿는 물질', '형태가 없는 현상'], a: 0 },
    { o: ['한 가지 원소', '여러 원소가 붙은 것'], a: 1, final: true } ] },
  { id: 'rainbow', name: '무지개', glyph: '🌈', clue: '비 갠 뒤 해를 등지면 보인다. 다가가면 멀어진다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 1 },
    { o: ['손에 닿는 물질', '형태가 없는 현상'], a: 1 } ] },
  { id: 'whale', name: '고래', glyph: '🐋', clue: '물속에 살지만 숨을 쉬러 올라온다.', steps: [
    { o: ['살아 있는 것', '살아 있지 않은 것'], a: 0 },
    { o: ['물고기', '젖먹이 짐승'], a: 1 } ] },
  { id: 'bat', name: '박쥐', glyph: '🦇', clue: '날개가 있다. 새끼에게 젖을 먹인다.', steps: [
    { o: ['새', '젖먹이 짐승'], a: 1 } ] },
  { id: 'phone', name: '휴대전화', glyph: '📱', clue: '연우의 주머니에 있던 것. 날짜 자리에 ??만 뜬다.', steps: [
    { o: ['살아 있는 것', '만들어진 것'], a: 1 },
    { o: ['톱니로 움직이는 것', '전기로 움직이는 것'], a: 1 } ] },

      { t: '모든 줄이 모이는 자리로 간다', h: '나무가 실타래를 더 모은다', lore: '두 동강 — 굵은 뿌리들이 사방에서 모여드는 자리에 집 한 채만 한 매듭이 있었다. 그 매듭이 두 동강 나 있었다. 단면이 반듯했다. 해체자가 끊은 노란 실처럼. 볕마을 기록 천에서 잘려 나간 이름 자리처럼. 두 단면 사이로 작은 빛들이 계속 새어 나와 흩어졌다. 등불을 든 서린의 굽은 손가락에 힘이 들어갔다. “이걸 끊었어.”', reward: { idle: 1 } } ] },
  { id: 'bundle', name: '가라앉는 다발', icon: '🔻', cost: 5700, after: ['path'], scene: [
      '모든 줄이 모이는 자리 밑에 집 한 채만 한 매듭이 두 동강 나 있었다. 아래쪽 반의 단면 가장자리에 해체자 수십이 모여 있었다. 무엇을 끊지도 않고 그냥 모여 있었다. 그 한가운데, 단면 위에 산란이 앉아 있었다.',
      '<div class="screen-text">중심 매듭 — 연결 영역 전체의 기록을 모으는 자리.<br>생성: 기록 없음.<br>상태: 절단.</div>',
      '산란은 매듭지기가 붙잡은 데부터 무너질 줄 알았다고 했다. <span class="say">“이걸 뭘로 끊었어?”</span> 서린이 묻자 산란이 말했다. <span class="say">“그건 안 알려 줘, 매듭지기. 당신이 뭘로 붙잡는지 나한테 안 알려 주잖아.”</span> 그런데 아무도 붙잡지 않고 자기 발로 나무까지 온 짐승들의 기록이 먼저 흩어진다고 산란이 말했다. <span class="say">“이건 계산에 없었어.”</span>',
      '도시로 가는 굵은 뿌리 위로 줄 한 다발이 다른 다발보다 훨씬 많이 처져 있었다.',
      '<div class="screen-text">연결 — 현재 영역.<br>받침: 중심 매듭(절단).<br>상태: 가라앉는 중.</div>',
      '다발 안쪽에 연우만 보는 붉은 줄이 한 가닥 섞여 있었다. 거울토끼를 틀린 날 정착지 우물 위에 남은 줄이었다. 다른 줄들은 처지는데 그 줄만 팽팽했다. 사각거리는 소리가 사방에서 겹쳤다. 해체자들이 다발로 몰려와 붉은 줄 옆에 걸린 가는 줄들을 끊기 시작했다. <span class="say">“줄이 당겨.”</span> 산란이 말했다. <span class="say">“네 줄. 해체자들이 그 줄로 몰려가.”</span>' ],
    opts: [
      { t: '끊긴 줄의 끝을 당긴다', h: '기록 천이 단단해진다', lore: '약함 — “당겨서 붙여. 내가 누를게.” 연우가 해체자를 쳐내고 끊긴 끝을 당기면 서린이 오른손 엄지로 눌렀다. 산란은 손바닥을 바닥에 대고 멀리서 오는 해체자들을 멈춰 세웠다. 붉은 줄 가까이 붙은 것들은 산란의 말도 듣지 않았다. 사각거림이 줄어든 것은 끊을 것이 줄어들어서였다. 서린이 이은 몇 가닥 가운데 하나에 이름이 떴다. 관계 기록 — 정착지. 이름: 은솔. 부르는 사람: 마루. 상태: 약함.', reward: { hp: 1 } },
      { t: '끊긴 끝 하나를 읽는다', h: '밤에 해체자가 느려진다', lore: '흩어짐 — 관계 기록 — 정착지. 이름: (흩어짐). 우물 줄 옆에 걸린 이름 기록이었다. 끊긴 끝은 정착지의 집보다 많았다. 한 사람에게 이름을 부르는 사람이 여럿이니까. 서린이 바닥에 주저앉았다. “정착지는 내가 붙잡아 뒀어. 붙잡은 게 풀리지 않는 한 거기서는 이름이 안 풀려.” 풀리면 이을 데가 없다고 했다. 은솔이 허리에 차고 다니는 천 한 장 말고는. 위에서 나무가 한 번 갈라지다 멈추는 소리가 나고, 스크린에 한 줄이 더 붙었다. 계속 가라앉으면 연결 영역 내 관계 기록 일괄 소실 가능.', reward: { slow: 1 } } ] },
  { id: 'far', name: '먼 곳의 선택', icon: '🧭', cost: 6000, after: ['bundle'], scene: [
      '<span class="say">“다른 데는 관찰자가 있잖아. 각자 자기 땅에.”</span> 산란이 연우를 보았다. <span class="say">“너희 쪽 관찰자는 지금 여기 있네.”</span>',
      '비 오던 운동장에서 들은 낮은 목소리가 뿌리 전체에서 울렸다. 서린도 산란도 듣지 못했다. <span class="say">“골라라. 여기서 고르면 그 땅에 닿는다. 저 손들이 하루 걸릴 일을 너는 숨 몇 번에 끝낸다.”</span>',
      '<div class="screen-text">중심 매듭 위치 — 관찰자 하나 확인.<br>연결 영역 분류 권한 — 임시 확장 가능.</div>',
      '다 고칠 수 있는 손. 처음 이 세계에 왔을 때 연우가 원하던 것이었다. 고르겠다고 하기도 전에 스크린이 바뀌었다.',
      '<div class="screen-text">표본 — 남쪽 소금 벌판, 물때 우물 곁의 집.<br>분류: 이 우물의 집 / 다른 우물의 집<br>선택까지 2.0</div>',
      '스크린에는 글씨뿐이었다. 연우는 그 집 사람의 얼굴도, 문틀의 금도 몰랐다.' ],
    opts: [
      { t: '숫자가 다 가도록 손을 들지 않는다', h: '나무가 실타래를 더 모은다', lore: '재관찰: 하나 — 0.0에서 두 줄이 번졌다. 가 본 적도 없는 땅에 번진 스크린 하나가 남았다. “근데 그 집은 그 사람들이 다시 봐. 물때마다. 열두 집이. 내가 고른 것보다 그게 맞을 거야.” 얼음 골짜기 물레방아 곁의 집도, 바닷가 절벽 계단 끝의 집도 숫자가 다 갔다. “에런도 그랬다. 고르지 않고 보기만 했지.” “에런은 혼자 다 봤잖아. 나는 혼자 안 봐.” 얼마 뒤 소금 벌판으로 가는 뿌리를 따라 약한 빛 하나가 왔다. 연우가 모르는 사람이 연우가 모르는 그 집 앞에서 다시 물은 것이었다.', reward: { idle: 1 } },
      { t: '흰 비탈로 가는 뿌리 앞에 선다', h: '실타래를 얻는다', lore: '위험 표시 — 흰 비탈로 가는 뿌리에는 빛이 오지 않았고 붙잡는 사람도 없었다. 관찰자 기록 종료. 연우가 고르면 그게 다였다. 틀려도 아무도 다시 보지 않을 것이었다. 서린이 노란 실을 한 뼘 끊어 뿌리 앞에 매듭을 지었다. “누가 오면 알게. 여기 뭐가 있었고, 지금은 아무도 안 붙잡고 있다는 거.” 그러고는 끊긴 매듭의 단면에 손바닥을 댔다. “이걸 붙잡으면 다 안 떨어지겠지.” 서린은 손을 천천히 뗐다. “누구한테 물어야 돼? 이 매듭에 걸린 사람 다한테? 세상 전부한테? 못 물어. 그러니까 안 해.”', reward: { ieum: 1550 } } ] },
  { id: 'gatebook', name: '남쪽 문 장부', icon: '📖', cost: 5650, after: ['path'], scene: [
      '밑동 아래에서 하루를 걸어 돌아오니 새벽이었다. 해담은 기록소 안쪽 방에서 이번에도 자지 않은 얼굴로 기다리고 있었다. 연우는 본 것을 다 말했다. 두 동강 난 중심 매듭, 처져 가는 이 땅의 다발과 그 안의 붉은 줄, 해체자들이 끊어 간 정착지의 이름 기록. 이제 남은 것은 정착지 사람들 이름을 적은 은솔의 천 한 장이었다. 해담은 안경을 벗어 손등으로 눈을 눌렀다가 다시 썼다.',
      '솥뚜껑 남자가 젖은 소매로 들어왔다. 밤새 고가를 건너왔다고 했다. <span class="say">“덮개가 밤마다 들썩여. *딸꾹*”</span> 그러고는 서린을 보았다. <span class="say">“마루가 엄마 이름이 늦게 나온대. 아침마다. 처음엔 숨 두 번이라더니, 어제는 해가 지붕까지 올라오고서야 나왔대.”</span> 은솔은 서린에게 알리기만 하라고 했다. 오라는 말은 하지 말고. 서쪽을 끊었다는 여자, 산란은 정착지 나무 밑에 앉아 우물만 본다고 했다.',
      '서린이 문 쪽으로 돌아섰다. 연우가 잠깐만요, 하고 붙잡았다. 밑동 아래에서 스크린은 기록실에 보관된 서린과 산란의 끊긴 관계 기록도 흩어질 수 있다고 띄웠다. 서린은 그게 뭐였는지 보고 싶다고 했었다. <span class="say">“해담 씨, 서린 씨가 처음 도시에 왔을 때 기록 있어요?”</span>',
      '그 기록은 기록소의 봉한 서고에 있었다. 해담은 회의에 청하기 전에 빈 장을 펴고 조건을 냈다. 미정의 약한 데를 연우의 손으로 적어 달라고. 연우는 한글로 적었다. 하나, 새 미정은 저만 만들 수 있다. 둘, 묻는 사람이 없으면 풀린다. 셋, 제가 중심 나무에 가 있는 동안 이 땅을 보는 관찰자는 없었다. 넷, 저는 떠날 수도 있다. 해담은 그 아래에 자기 이름과 한 줄을 더 적었다. 그런데도 무너지지 않았다.',
      '기록소 앞마당의 회의에서 흰머리 노인이 지팡이로 땅을 한 번 짚었다. 그것으로 서고를 열기로 정해졌다. 서고의 선반에서 해담이 열두 해 전 남쪽 문 출입 장부를 꺼내 한 줄을 짚어 읽었다. <span class="say">“남쪽 강가 마을. 물에 잠김. 서린, 열일곱. 산란, 열넷.”</span>',
      '<span class="say">“두 사람을 한 줄에 적었습니다. 같이 들어왔다는 뜻입니다.”</span> 그 옆, 누구와 왔는지 적는 칸은 비어 있었다. 등불을 기울이자 잉크 없이 펜으로 꾹 눌린 자국이 보였다. 두 글자쯤이었다.' ],
    opts: [
      { t: '“뭐라고 쓰셨는데요?”', h: '기록 천이 단단해진다', lore: '두 아이 — “기억나지 않습니다.” 해담이 말했다. 비 오는 날이었고, 젖은 두 아이가 같이 문 앞에 섰다고 했다. 작은 아이가 큰 아이의 소매를 잡고 있었다고. 둘이 무슨 사이냐고 묻자 큰 아이가 대답했고, 해담은 그 대답을 그 칸에 적었다. “나는 혼자 왔어.” 서린이 말했다. “아무도 소매 안 잡았어. 나는 그렇게 기억해.” “저도 그날을 기억합니다. 두 아이였습니다.” 해담이 조용히 말했다. 서린이 엄지로 자국을 눌렀다. 종이는 천이 아니었다. 스크린에는 한 줄만 떴다. 관계 기록 — (끊김).', reward: { hp: 1 } },
      { t: '빈칸의 테두리를 짚는 해담을 본다', h: '나무가 실타래를 더 모은다', lore: '남긴 칸 — “저는 칸을 비워 두지 않습니다.” 북쪽 둑길의 네 칸 말고는 다섯 해 동안 비워 둔 칸이 없다고 생각했다고 해담이 말했다. “여기 하나가 더 있었습니다. 열두 해 동안. 제가 남긴 칸인데, 저는 남긴 줄도 몰랐습니다.” 해담은 장부를 겨드랑이에 끼웠다. 밖으로 가지고 나갈 수 없는 장부라 자기 이름을 적고 가지고 나가겠다고 했다. 정착지는 어느 장부에도 없으니 이번에는 자기가 적겠다고 했다. “이 칸의 다른 한 사람이 거기 계신다고 들었습니다.”', reward: { idle: 1 } } ] },
  { id: 'hum', name: '같은 노래', icon: '🎵', cost: 6050, after: ['gatebook'], scene: [
      '고가를 하루 내내 걸어 해가 기울 무렵 정착지 쪽 끝에 닿았다. 마루가 밧줄을 무릎에 감고 기다리고 있었다. <span class="say">“형~!”</span> 밧줄 끝에는 우물 수위를 재던 검은 매듭과 따로 작은 매듭이 여럿 묶여 있었다. 뒤로 갈수록 간격이 벌어졌다.',
      '<span class="say">“엄마 이름 나온 때~ 아침에 해 뜨는 데서 시작해서, 이름 나오면 묶어.”</span> 마루가 마지막 매듭을 짚었다. <span class="say">“오늘은 여기. 점심 먹을 때~”</span> 그러고는 그 매듭을 손톱으로 툭 튕겼다.',
      '정착지 나무의 잎은 모두 접혀 있었다. 그 밑 굵은 뿌리 위에 산란이 앉아 우물 쪽을 보고 있었다. 은솔이 우물가에서 걸어와 서린을 보았다. <span class="say">“닷새 만이야... 오라고는 안 했는데...”</span>',
      '밤이 되자 나무 밑에서 가사 없는 허밍이 났다. 볕마을 가람의 집에서 들은 자장가였다. 잎 하나 펴면 해가 오고, 잎 둘 펴면 물이 오고. 자장자장 우리 아가, 셋째 잎엔 누가 오나. 허밍은 늘 그렇듯 거기서 끊겼다.',
      '그런데 이번에는 뒤가 왔다. 우물가 노란 실 앞의 어둠에서, 서린의 목소리로. <span class="say">“셋째 잎엔 네가 크고, 넷째 잎엔 손을 놓지.”</span>',

      '산란은 그 자리에서 북쪽 둑길 일도 모두 앞에서 말했다. 그날 둑길에 하랑이라는 아이가 있었고, 자기는 한 달 뒤에야 알았다고. <span class="say">“몰랐어. 근데 몰랐다고 내 탓이 아닌 건 아니야.”</span> 내일 해담과 함께 그 아이 엄마에게 가서 말하고, 돌아와 다시 여기 서겠다고 했다.',
      '회의가 끝나고 사람들이 장터 쪽 돌계단으로 내려갈 때였다. 연우는 서린과 계단 위에 서 있었다. 겨울 거리 쪽에서 소매가 터진 남자 하나가 뛰어나와, 몇 칸 아래에서 혼자 내려가던 산란에게 곧장 달려갔다. 손에 무언가를 쥐고 있었다. 산란은 피하지 않고 그 자리에 섰다.',
      '연우의 몸이 생각보다 먼저 움직였다. 둘 사이에 끼어든 연우는 남자의 어깨에 부딪혀 계단을 세 칸쯤 굴렀다. 남자가 쥔 것을 떨어뜨렸다. 돌이었다. <span class="say">“아니, 나는……. 애한테 그런 게 아니라…….”</span> 겨울 거리 사람 둘이 남자를 끌고 갔다.',
      '손바닥에서 피가 배어 나왔다. 돌가루가 박힌 채. 심장이 귀에서 들릴 만큼 뛰었고, 피가 배어 나오는 박자가 심장과 같았다. 스크린이 떴다.',
      '<div class="screen-text">표본 360 — 관찰자 이연우.<br>분류: 살아 있는 것 / 관계 기록</div>',
      '숫자는 없었다. 선택까지라는 말도 없었다. 관계 기록이라는 말은 중심 나무 밑동 아래에서 보았다. 흰다리의 매듭에 남아 있던 것. 그 아래의 한 줄. 개체 상태: 기록 범위 밖.' ],
    opts: [
      { t: '떨리는 손을 스크린 쪽으로 뻗는다', h: '기록 천이 단단해진다', lore: '소매 — 하늘색 빛이 스크린이 아니라 연우의 손바닥에서 일었다. 피 묻은 손의 금을 따라 번졌다가 가슴께에서 멎었다. 아무것도 아물지 않았다. 분류: 살아 있는 것. 다음 분류 대기. 산란이 계단을 올라와 연우 앞에 쪼그려 앉았다. “바보야? 내가 맞을 거였어. 맞아도 됐어.” “안 돼요. 맞아도 되는 사람이 어딨어요.” 산란은 겉옷 소매 끝을 이로 물어뜯어 찢고, 그 천으로 연우의 손바닥을 감아 손등에서 묶었다. “우리 집 버릇이래. 소매 찢어서 묶는 거. 이번에 알았어.” 서린은 세 걸음 위에서 그 손을 보고 있었다.', reward: { hp: 1 } },
      { t: '관계 기록이라는 말을 오래 본다', h: '밤에 해체자가 느려진다', lore: '이 떨림이 — 관계 기록은 아프지 않을 것이다. 숨이 막히지도 않고, 계단에서 굴러도 피가 나지 않을 것이다. 민재와, 서린과, 은솔과 마루와 이어져 있다는 사실만 남는다. 연우만 거기 없을 것이다. 잠깐, 아주 잠깐, 그게 나쁘지 않게 느껴졌다. 그 생각이 무서웠다. 그 생각을 한 자신이 더 무서웠다. 손바닥에서 피가 한 번 더 배어 나왔다. 심장 박자에 맞춰. 연우는 떨리는 손을 뻗었다. 살아 있는 것. 스크린은 그 답을 받았지만 몸은 아무것도 바뀌지 않았다. 두려움은 처음보다 또렷해졌다. 이게 내 거라고. 이 떨림이. 이 피가.', reward: { slow: 1 } } ] },
  { id: 'fed', name: '누가 먹였나', icon: '🍼', cost: 6800, after: ['alive'], scene: [
      '이튿날 해 뜰 무렵 산란과 해담이 하랑의 엄마에게 가려고 북쪽 문으로 떠났다. 연우의 손바닥에는 계단에서 다친 데를 산란이 소매를 찢어 감아 준 천이 그대로 있었다. <span class="say">“그거 오늘 저녁엔 풀어. 너무 오래 묶어 두면 안에서 곪아.”</span> 산란은 무언가 더 말하려다 광장 쪽을 보았다. 서린이 말뚝 옆에 서 있었다. <span class="say">“아니야. 됐어.”</span>',
      '<span class="say">“밑동 아래 가 볼래.”</span> 서린이 말했다. 묻는 말이 아니었다. <span class="say">“그 목소리, 늘 아래에서 들었다며. 네 표본이 뭘 기다리는지 물어볼 데가 거기밖에 없잖아.”</span>',
      '뿌리 계단 아래의 굴을 반나절쯤 걸었을 때, 처음 내려올 때도 쉬었던 마른 흙바닥에서 서린이 떡을 반으로 갈랐다. 서린은 연우의 손등에 있는 매듭을 말린 엄지로 스쳤다. <span class="say">“걔가 이렇게 묶었어. 강에서. 나한테. 손등에서 두 번 돌려서.”</span>',
      '<span class="say">“서린 씨는 엄마 기억나요?”</span> <span class="say">“조금. 노래. 그리고 밥.”</span> 엄마는 둘에게 먼저 퍼 주고 남은 것을 먹었다고 했다. 자매가 끊기니까 엄마도 반쯤 같이 끊겼던 거라고. 그러고는 서린이 물었다. <span class="say">“너는. 부모 없다며? 기록 없음. 그럼 누가 먹였어?”</span>',
      '연우가 대답하지 못하자 서린이 덧붙였다. <span class="say">“누가 먹였으니까 여기 있는 거잖아. 아기는 혼자 못 먹어. 누가 안고 먹였어. 그건 기록이 없어도 있었던 거야.”</span>',
      '연우는 보호시설 원장 선생님에게 들은 이야기를 처음으로 소리 내어 해 보았다. 아기 때 눕혀 놓고 우유를 주면 고개를 돌렸다고. 누가 안아야만 먹어서 밤 당번 선생님들이 돌아가면서 안고 먹였다고. 그 선생님들의 이름은 몰랐다. <span class="say">“그래도 안았네.”</span> 서린이 말했다.',
      '다른 것들도 떠올랐다. 열이 나던 밤, 틀린 박자로 유행가를 흥얼거리던 당직 선생님. 급식을 반 덜어 주며 너 이거 안 먹으면 내가 먹는다, 하던 민재. 편의점 앞 벤치의 컵라면 두 개. 그때 천에 감긴 손 위로 스크린이 떴다.',
      '<div class="screen-text">표본 360 — 관찰자 이연우.<br>분류: 포유류 / 혼자 자란 것</div>' ],
    opts: [
      { t: '“기록에는 없어요.”', h: '나무가 실타래를 더 모은다', lore: '먹인 게 없는 게 아니라 — 연우는 포유류가 젖을 먹여 기르는 짐승이고 사람도 거기 들어간다고 설명했다. “그럼 아까 그거네. 누가 먹였냐.” “기록에는 없어요.” “기록이 없는 거지. 먹인 게 없는 게 아니라.” 안고 먹인 사람은 연우를 낳은 사람이 아니었다. 낳은 쪽의 젖만 센다면 연우는 틀린다. 그래도 안아야만 먹던 아기가 지금 열일곱이 되어 여기 앉아 있었다. 기록보다 먼저 있는 증거. 연우는 손을 뻗었다. 포유류. 하늘색 빛이 손등의 매듭을 한 번 돌고 가슴께에서 멎더니, 그 자리가 아주 조금 따뜻해졌다. 아기 이야기, 틀린 박자, 급식, 컵라면. 하나도 빠지지 않았다.', reward: { idle: 1 } },
      { t: '물통을 무릎에 올려놓은 서린을 본다', h: '실타래를 얻는다', lore: '노래 한 줄 — 연우가 포유류를 고른 뒤, 서린은 물통 마개를 닫고도 한동안 물통을 무릎에 올려놓고 있었다. “걔도 안 먹었어. 엄마 없어지고 나서. 강가 사람들이 죽을 줘도 고개를 돌렸어. 그래서 내가 먹였어. 무릎에 앉혀 놓고. 한 숟가락 먹으면 노래 한 줄. 앞 구절.” 산란은 기억 못 할 거라고 했다. 그때 너무 어렸다고. 말해 줄 거냐고 연우가 묻자 서린이 말했다. “말하면 내가 해 준 걸 갚으라는 것 같잖아.” “원장 선생님은 웃으면서 말했어요. 갚으라는 얼굴 아니었어요.” 서린은 대답하지 않고 등불 심지를 낮췄다. 굴 안쪽 멀리서 사각거리는 소리가 들려오고 있었다.', reward: { ieum: 1800 } } ] },
  { id: 'human', name: '마지막 분류', icon: '✋', cost: 7300, after: ['fed'], scene: [
      '사각거리는 소리는 걸을수록 커졌다. 밑동 아래의 쌀알만 한 매듭들은 반쯤이 회색으로 흐려져, 바람도 없는데 가늘게 떨렸다. <span class="say">“보관. 풀리고 있어요.”</span> 연우가 말했다.',
      '두 동강 난 중심 매듭 사이로 연우만 보는 붉은 줄이 팽팽하게 지나갔다. 정착지 우물에서 온 줄, 거울토끼의 오답이었다. 해체자 수백이 그 줄을 따라 오르내리며 줄 가까이 매달린 가닥들을 끊었다. 서린은 말린 엄지 대신 집게손가락 옆면을 대어 끊긴 가닥을 이었다. <span class="say">“다 못 이어. 여기서 내가 이을 수 있는 건 손 닿는 데까지야.”</span>',
      '흰다리의 가닥은 그 자리에 있었다. 둘레의 가닥들이 끊겨 흩어진 한가운데에서, 그 매듭만 흐리지만 희었다. 연우는 다가가지 않았다. 남아 있다는 것만 보았다.',
      '뿌리 전체에서 낮은 목소리가 울렸다. 서린은 듣지 못했다. <span class="say">“네 표본이 거의 끝났다. 살아 있는 것. 포유류. 기록이 없는 데를 기록이 아닌 걸로 채웠더군.”</span>',
      '<div class="screen-text">표본 360 — 관찰자 이연우.<br>최종 분류: 인간 / 초월자</div>',
      '<span class="say">“초월자는 뭐야?”</span> <span class="say">“나 같은 것. 숫자가 없다. 둘 중 하나도 없다. 보는 대로 된다. 고칠 것을 보면 고쳐진다. 저 붉은 줄도.”</span> 우물의 이름들도, 북쪽 둑길의 열한 명도, 친구 민재의 일까지도. 고르기만 하면.',
      '<span class="say">“하고 싶어?”</span> 서린이 물었다. <span class="say">“네. 다 고치고 싶어요. 처음부터 그랬어요. 운동장에서 세상 다 부숴 버리고 싶다고 했을 때도. 부수고 싶었던 게 아니라 다 고치고 싶었어요.”</span> 서린이 엄지만 안쪽으로 말린 오른손을 펴 보였다. <span class="say">“나도 그랬어. 볕마을 날. 고치고 싶은 마음이 크면, 묻는 게 귀찮아져. 고르지 말라는 말 아니야. 네가 정해. 근데 하고 싶은 게 크다는 건 알고 골라.”</span>',
      '보면 고쳐진다. 그러면 묻지 않아도 된다. 마루에게도, 하랑의 엄마에게도, 민재에게도. 연우는 그게 싫었다. 처음으로 분명하게. <span class="say">“안 할래요. 안 묻고 고치는 건 안 할래요. 모르면 물어볼래요. 물어봐서 틀리면 그것도 제 거로 할래요. 저 붉은 줄처럼.”</span> 연우는 산란이 감아 준 천이 있는 손을 뻗었다. 인간.',
      '<div class="screen-text">표본 360 — 분류 완료.<br>관찰자 이연우 — 인간.<br>연결 영역 내 대기 중인 표본: 없음.</div>',
      '<span class="say">“사람이래요.”</span> <span class="say">“알아.”</span> 그 순간 사각거림이 멎었다. 두 동강 난 매듭의 단면이 하늘색으로 빛나며 서로를 향해 다가가더니, 자국 없이 하나로 이어졌다. 무언가가 묶이는 소리가 났다. 빛이 사방의 뿌리로 퍼졌고, 해체자들이 날리는 재처럼 흩어졌다. 스크린이 다음 줄을 띄웠다. 연우가 부르지 않았는데.',
      '<div class="screen-text">관찰 권한(임시) — 종료 조건 충족.<br>종료 처리: 처리되지 않음.<br>권한 귀속: 관찰자 이연우.</div>' ],

      '<span class="say">“수를 원하면 말해 주겠다. 이 땅에 숨 쉬는 사람의 수와 내 땅에 숨 쉬는 사람의 수.”</span> <span class="say">“말하지 마세요. 수로 정하라는 거예요?”</span> <span class="say">“수로 정하라는 것이 아니다. 수가 있다는 것을 알라는 것이다.”</span>',
      '서린이 연우와 흙의 손 사이에 섰다. <span class="say">“얘 혼자 정하는 거야? 여기 사는 사람들 일을.”</span> <span class="say">“이름을 준 손이 정한다. 너희는 그 손에 말할 수 있다. 붙잡을 수도 있고, 끊을 수도 있다.”</span> 산란의 입꼬리가 올라가다 말았다. <span class="say">“결국 또 누가 정해 주는 거네. 이번엔 얘가.”</span>',
      '흙의 손이 손가락부터 무너져 금 속으로 흘러내렸다. 다 가라앉기 전에 목소리가 한 번 더 났다. <span class="say">“다섯 번. 그 전에 와라. 네가 내 땅에서 이 땅으로 넘어온 자리로. 거기서 듣겠다.”</span>' ],
    opts: [
      { t: '시계탑 아래 계단에 앉는다', h: '기록 천이 단단해진다', lore: '그 말 말고 — 밤이 되자 연우는 시계탑 아래 계단에 앉았다. 서린이 옆에 앉았고, 산란은 세 걸음 떨어진 곳에 섰다. “어떻게 할 거야?” “모르겠어요.” “그 말 말고.” 연우가 처음 모른다고 했을 때부터 그 말을 받아 주던 사람이었다. “이 땅을 고르면 은솔 씨도 마루도 서린 씨 손도 남아요. 저도요. ……근데 민재가 떨어져요. 지구에 있는 사람들이 다요. 지구를 고르면 저는 돌아가요. 그냥 사람으로요. 그리고 여기가…….” 연우가 끝맺지 못한 말을 산란이 세 걸음 거리에서 대신 했다. “떨어지지. 우리가.” 서린이 일어서며 이번에는 발밑부터 보았다. “다섯 번이면. 내일 아침이 한 번이야.”', reward: { hp: 1 } },
      { t: '해담이 받아 적은 것을 듣는다', h: '나무가 실타래를 더 모은다', lore: '빈칸 하나 — 흙이 다 가라앉자 광장 사람들이 한꺼번에 떠들었다. “장 펴, 말아? 누구한테 물어야 돼, 이거!” 함지가 소리쳤고, 겨울 거리 구역장은 자기 거리가 남느냐고 물었다. 해담이 장부를 펼친 채 연우에게 왔다. “목록 밖 분. 방금 들은 것을 제가 적은 대로 읽어 드리겠습니다.” 기록소의 어느 목록에도 이름이 없는 연우를 해담은 그렇게 불렀다. 다섯 번째 해. 사람. “맞아요.” “한 가지가 빠졌습니다. 주소에 매달린 것이 무엇인지, 떨어진다는 것이 무엇인지. 제가 물어야 했는데 묻지 못했습니다.” 연우는 밑동 아래에서 중심 매듭이 끊겼을 때를 떠올렸다. 아무도 붙잡지 않은 기록부터 빛이 빠져나가 흩어지던 모습. 그것이 이 땅 전부에서 한꺼번에 일어나는 일이었다. “알 것 같아요.” 해담은 더 묻지 않았다. 펜을 쥔 채 그 칸을 비워 두었다.', reward: { idle: 1 } } ] },
  { id: 'life', name: '두 세계의 생명', icon: '🐜', cost: 7500, after: ['basis'], scene: [
      '광장 사람들이 흩어진 밤, 시계탑 아래 계단에 혼자 남은 연우 앞으로 개미 한 마리가 기어 나왔다. 검고 작은 지구의 개미 위에 더듬이가 셋인 이 세계의 벌레가 겹쳐 있었다. 다리가 두 벌이었다. 땅 다음은 생명이라고 했다.',
      '<div class="screen-text">두 세계의 생명 — 기록 둘.<br>분류: 지구 — 현재 영역 / 지구 — 관찰자의 원래 세계</div>',
      '숫자는 없었다. 표본 360 때처럼. 이 벌레는 이 돌계단 틈에서 났을 것이다. 연우는 현재 영역을 눌렀다. 검은 개미가 얇아지다 없어지고, 다리가 한 벌인 벌레만 계단 틈으로 기어 들어갔다. 발밑의 금에서 아주 작게 흙 비벼지는 소리가 났다. <span class="say">“내 땅의 개미 하나가 떨어졌다.”</span>',
      '첫 번째 해가 뜨자 시계탑 처마에서 날개가 두 쌍인 새들이 떨어졌다. 이 세계의 회색 깃털 새와 지구의 비둘기가 한 몸에 겹친 것들이었다. 연우는 고르지 않았다. 고르지 않는 동안 새들은 떨었다. 해담은 무엇이 겹치고 무엇이 떨어지는지라도 적겠다며 도시에 남았다. 다섯 번째 해 전에는 그 자리로 오겠다고 했다. 연우는 가이아가 오라고 한 자리, 처음 넘어온 정착지 가장자리의 끊어진 도로로 떠났다.',
      '해 질 무렵 정착지 가장자리, 노란 실 앞에 짐승 하나가 엎드려 있었다. 등에 이끼가 돋고 이마에 가느다란 뿔이 두 개. 왼쪽 앞발만 발목까지 희었다. 짐승은 숨을 두 번씩 쉬었다. 뿔이 흐려지는 순간 입가에 작고 하얀 엄니가 비쳤다. 학교 뒷산 산책로 안내판에서 본 짐승. 고라니였다.',
      '<span class="say">“여기서 났어... 저 돌 위에 흰 점이 있었거든... 마루가 매일 봤어...”</span> 은솔이 길목의 젖은 돌을 가리켰다. 마루가 연우를 올려다보았다. <span class="say">“형. 흰다리야~?”</span> 줄을 따라가면 알 수 있었다. 연우는 보지 않았다. <span class="say">“몰라. 흰다리 발이랑 똑같아. 근데 몰라.”</span>',
      '현재 영역을 고르면 지구 어딘가에서 고라니 한 마리가 떨어진다. 관찰자의 원래 세계를 고르면 이 짐승은 이 땅의 기록에 없는 짐승이 된다. <span class="say">“고르면 저쪽에서 하나가 죽어요. 그래서요.”</span> 짐승의 검고 큰 눈이 연우를 보았다. 연우는 현재 영역을 눌렀다. 이끼가 짙어지고 뿔이 또렷해졌다. 짐승이 한 박자로 숨을 쉬었다.',
      '그때 땅이 울렸다. 이번에는 모두가 들었다. <span class="say">“내 땅에서 고라니 한 마리가 떨어졌다. 찻길 가 풀숲에서. 새끼를 밴 암컷이었다.”</span>' ],
    opts: [
      { t: '손목을 잡은 서린의 손을 본다', h: '밤에 해체자가 느려진다', lore: '그거 끝나? — 해가 거의 지자 정착지의 새와 벌레와 거미줄이 두 겹이 되었다. 스크린이 겹쳐서 떴다. 연우는 눌렀다. 현재 영역. 현재 영역. 하나를 누를 때마다 발밑에서 소리가 났다. 내 땅의 참새 하나. 내 땅의 거미 하나. 숫자가 없으니 기다릴 이유가 없었다. 눈만 가면 됐다. 서린이 연우의 손목을 잡았다. 엄지가 말린 오른손이었다. “그만. 하나 고르면 저쪽에서 하나 떨어지고. 또 하나 고르면 또 하나. 그거 끝나?” 발밑에서 흙의 목소리가 났다. “정답을 아무리 많이 골라도 겹침은 끝나지 않는다. 기준은 하나다.” 이끼 짐승이 네 다리로 일어나 노란 실 아래로 빠져나갔다. 끊어진 도로 쪽으로. 뒷다리가 납작해지지 않았다.', reward: { slow: 1 } },
      { t: '고가에서 나란히 걷는 산란의 말을 듣는다', h: '실타래를 얻는다', lore: '쉬웠어? — 정착지로 가는 고가 위에는 잎이 두 겹인 풀이 돋아 있었다. 한 겹은 강아지풀, 다른 한 겹은 이 세계의 붉은 풀. 두 잎이 같은 줄기에서 서로를 덮다가 함께 말라 갔다. 고가 한가운데쯤에서 산란이 걸음을 늦추고 연우 옆에서 걸었다. “어젯밤에 계단에서 뭐 하나 골랐지? 손 뻗는 거 봤어.” “개미요. 이 세계 쪽으로 골랐어요.” “쉬웠어?” 연우는 대답하지 않았다. 쉬웠다. 쉬웠다는 게 무서웠다. “나는 끊을 때 쉬웠던 적이 있어. 처음엔 안 쉬웠는데, 나중엔 쉬웠어. 그때부터 이상해졌어.” 산란은 연우가 대답하기 전에 다시 앞서 걸었다.', reward: { ieum: 2000 } } ] },
  { id: 'field', name: '실 너머의 운동장', icon: '🏀', cost: 7800, after: ['life'], scene: [
      '두 번째 해가 기울 무렵, 마루가 정착지 가장자리를 가리켰다. 이끼 짐승이 달려간 끊어진 도로 쪽이었다. 연우는 노란 실 앞까지 갔다. 연우가 처음 눈을 뜬 거리, 중앙선이 끊긴 아스팔트 위에 넓고 평평한 붉은 흙이 겹쳐 있었다. 흰 선과 녹슨 철제 농구골대. 운동장이었다.',
      '세상을 다 부숴 버리고 싶다고, 나라면 똑바로 세울 수 있을 거라고 소리 지르던 자리였다. 실 너머의 흙이 무릎 높이까지 솟았다. <span class="say">“네가 넘어온 자리다.”</span>',
      '운동장의 하늘은 이 세계의 해보다 빨리 저녁이 되었다가 밤이 되었다. <span class="say">“제가 떠난 지 얼마나 됐어요? 거기서요.”</span> <span class="say">“네가 떠난 뒤로 내 땅에서 해가 이백아흔 번 넘게 떴다.”</span> 열 달. 여기서 보낸 날을 다 합쳐도 석 달 남짓이었다.',
      '<span class="say">“민재는요? 아니에요. 말하지 마세요.”</span> <span class="say">“나는 네 친구를 이름으로 알지 못한다. 너는 그의 줄을 볼 수 있다. 보지 않았다. 그럼 운동장을 보아라. 누구든 그 자리에 서 있으면 볼 수 있는 것이다.”</span>',
      '철망에 비닐에 싸인 종이가 붙어 있었다. 학기 초에 찍은 연우의 학생증 사진. 그 아래의 큰 글씨는 한 번에 읽혔다. 이 세계에서 석 달이 지나도록 하나도 읽지 못한 글씨들과 달리. 이연우를 찾습니다. 연락처는 보호시설 당직실 번호였다.',
      '하늘이 몇 번 밝아졌다가 어두워진 저녁, 운동장에 한 사람이 들어왔다. 두꺼운 패딩, 한쪽 어깨에 건 가방, 낡은 흰 운동화. 얼굴을 보기 전에 걸음으로 알았다. 민재였다. 민재는 떨어진 종이 귀퉁이에 가방에서 꺼낸 테이프를 새로 붙였다. 한 번, 두 번. 손바닥으로 문질렀다.',
      '민재는 농구골대 쪽, 연우가 마지막으로 서 있던 자리에 쪼그려 앉아 운동화 끈을 풀었다가 다시 묶었다. 마른 얼굴, 어두운 눈 밑. 그런데 늘 손등을 덮을 만큼 끌어내리던 소매가 손목 위에 그대로 있었다. 그게 무엇을 뜻하는지 연우는 몰랐다. 줄을 보면 알 수 있었다. 연우는 보지 않았다.' ],
    opts: [
      { t: '“민재야.”', h: '기록 천이 단단해진다', lore: '실 한 가닥 — 목소리가 운동장 쪽으로 나갔다가 조금 늦게, 끝이 또렷하게 돌아왔다. 처음 이 세계에서 눈을 떴던 밤, 누구 없느냐고 외친 말이 되돌아오던 것처럼. 그때도 이 자리였다. 민재는 돌아보지 않았다. 비 오던 날 운동장 입구에서도 그랬다. 그때 연우는 따라갈 수 있었는데 손을 또 뿌리칠까 봐 그 자리에 섰다. 지금은 따라갈 수 없었다. 실 한 가닥 너머는 다른 땅이었다. 운동장 입구에서 회색 코트를 입은 당직 선생님이 민재를 불렀다. 나는 네 말 믿어, 하고 문간에 오래 서 있던 사람. 선생님이 민재의 어깨에 짧게 손을 얹었다. 민재는 그 손을 뿌리치지 않았다. 둘은 함께 나갔고, 민재가 한 번 농구골대 쪽을 돌아보았다. 민재는 연우가 와서 구해 주기를 기다리며 멈춰 있지 않았다. 지구의 시간은 열 달을 그냥 흘렀다.', reward: { hp: 1 } },
      { t: '옆에 와 앉은 서린에게 종이를 읽어 준다', h: '나무가 실타래를 더 모은다', lore: '그것도 시간이야 — “저거 너야? 뭐라고 쓰여 있어?” “저를 찾는대요. 거기서는 제가 사라진 지 열 달 됐대요.” 서린은 실 앞의 흙바닥에 앉았다. “여기선 석 달쯤이지? 그것도 시간이야. 석 달이어도. 네가 여기 있었던 거.” 아까 그 애가 그 친구냐고, 돌아가면 걔를 고칠 수 있느냐고 서린이 물었다. “아니요. 힘 없어져요. 그냥 저로 돌아가요.” “그럼 왜 가?” 정말 궁금해서 묻는 목소리였다. “아직 간다고 안 했어요. ……묻고 싶은 게 있어요. 걔한테요. 무슨 말을 하지 말라는 거였는지. 고쳐서 알면 안 되는 거예요. 걔가 대답해야 되는 거예요. 대답 안 해도요.” 그러다 연우의 목소리가 갈라졌다. 그거 하나 때문에 여기를 다 떨어뜨리는 건 아니잖아요. “아니지.” 다른 방법이 있을 거라고, 둘 다 남는 방법을 찾겠다고 연우가 말하자 서린은 발밑을 보는 눈으로 연우를 보았다. “있으면 좋겠다.”', reward: { idle: 1 } } ] },
  { id: 'asker', name: '시험을 낸 자', icon: '💬', cost: 8300, after: ['field'], scene: [
      '세 번째 해가 뜨자 연우는 할 일을 정해 두었다. 먼저 이름이었다. 이 땅 사람들이 이 땅 전체를 부르던 말, 아래. 연우가 소리 내어 부르자 스크린이 떴다.',
      '<div class="screen-text">이름 기록 — 현재 영역.<br>지구.<br>한 주소에 이름 하나.<br>이름 추가: 응답할 수 없음.</div>',
      '은솔의 수첩에 한글로 적어도 아무것도 뜨지 않았다. 다음은 옮기는 것이었다. 우물가에서 이 땅이 이 땅 그대로 다른 곳으로 옮겨 가기를 바라자, 처음으로 연우가 바란 쪽으로 스크린이 떴다.',
      '<div class="screen-text">새 영역 생성 — 가능.<br>옮길 수 있는 것: 관계 기록.<br>생명 상태: 기록 범위 밖.</div>',
      '옮겨지는 것은 매듭뿐이었다. 우물가에서 물을 나누던 아침들은 가지 않았다. <span class="say">“생명과 역사는 주소만 바꿔 옮길 수 없다. 다른 데로 옮기면 기록만 간다.”</span> 가이아가 말했다. 마지막은 손이었다. 힘을 서린이나 산란에게 넘기려 하자 둘 다에게 같은 줄이 떴다. 관찰 권한 기록 없음. 이전할 수 없음. <span class="say">“우린 그런 거 받을 손이 없어. 처음부터.”</span> 서린이 말했다.',
      '그날 밤 연우는 정착지 나무 뿌리에 등을 대고 소리 내어 물었다. <span class="say">“너 들리지?”</span> 세 번째 빛이 지나갈 때 뿌리 밑에서 낮은 목소리가 났다. 지구라고 적은 날 이후 처음이었다. <span class="say">“들린다. 물어라. 네가 묻고 싶어 하던 것을.”</span>',
      '이름이 주소가 된다는 것도, 근원의 매듭이 연우를 묶은 것도, 권한이 끝나지 않은 것도 THE ROOT는 몰랐다고 했다. 마지막 표본은 늘 관찰자 자신이라 거기까지 간 자가 없었다고. 2.0과 4.0이 초가 아니라 간격이었다는 것, 여기서 하루 가는 동안 거기서 사흘 간다는 것은 알았다고 했다. <span class="say">“왜 말 안 했어?”</span> <span class="say">“묻지 않았다.”</span> <span class="say">“모르는 걸 어떻게 물어?”</span>',
      '<span class="say">“그래도 고르게 한 건 너야. 숫자 줄여 가면서. 설명도 안 하고.”</span> <span class="say">“그렇다. 고르게 한 것은 나다.”</span> 사과가 아니었다. 해담이 장부에 적는 말처럼, 사실 하나를 인정한 것이었다. 화가 가라앉은 뒤에야 연우는 정확한 질문을 했다. 지구를 고르면 여기서 무엇이 떨어지느냐고.',
      '<span class="say">“이름으로 매달린 것. 기록이 있는 땅, 기록이 있는 짐승, 기록이 있는 사람. 너희가 적은 장부와 천도.”</span> <span class="say">“이름이 안 적힌 건?”</span> <span class="say">“매달려 있지 않다.”</span> 처음 이 세계에서 눈을 떴을 때, 여기가 어디냐고 묻자 스크린은 지역명: 미기록이라고 답했다. 그 거리는 이름 없는 땅으로 남는다고 했다. 다만 사람의 이름은 기록에 적혀 있어서, 그 거리에 서 있어도 이름이 적힌 자는 매달려 있다고.',
      '그럼 적힌 이름을 떼면. 산란은 볕마을 모임터의 기록 천에서 자기 이름을 잘라 내고 고정 밖으로 나왔다. 그때 이름 앞에 적힌 ‘동생’까지 함께 잘려 나갔다. 연우는 그 생각을 붙잡았다. 아직 말하지는 않았다.',
      '<span class="say">“이름 없는 땅에는 너 닿아?”</span> <span class="say">“닿지 않는다. 아무도 스크린을 보지 않는다. 아무도 숫자를 세어 주지 않는다. 맞는지 틀렸는지 적어 주지 않는다.”</span>' ],
    opts: [
      { t: '“너 미안해?”', h: '기록 천이 단단해진다', lore: '그런 기록 — 빛이 지나갔다. 한 번, 두 번, 세 번. 열둘이 다 지나가도록 목소리는 나오지 않았다. “모른다. 그런 기록이 나에게 없다.” 그러고는 거의 들리지 않게. “네가 묻는 것에 답할 것이 없는 것은 처음이다.” “보러 와. 마지막에. 네가 시킨 거니까 끝까지 봐. 근데 그다음엔 보지 마. 여기 사람들. 이름 없어진 다음에.” 나무 반대편에서 집들을 다 돌고 온 서린이 엄지 끝을 왼손으로 감싸 쥔 채 왔다. 미안한지 모르겠대요, 그런 기록이 없대요, 하고 연우가 전하자 서린이 뿌리에 앉았다. “나도 그랬어. 볕마을. 일곱 해 동안. 사람들 살렸다는 것만 알았어. 미안한 줄은 몰랐어. 보리가 너보고 오빠는 누구냐고 묻는 거 보고 처음 생겼어.” “그 뒤로는 생겼어?” “생겼어. 안 없어지더라.”', reward: { hp: 1 } },
      { t: '우물에 밧줄을 내리는 마루 옆에 앉는다', h: '실타래를 얻는다', lore: '맞는 매듭 — 세 가지가 다 안 된 날 낮, 마루는 우물에 밧줄을 내려 수위를 쟀다. “셋 위야~ 어제도 셋 위. 그저께도 셋 위. 안 변해~” 그러다 물었다. “형. 그 목소리가 형한테 고르라고 한 거. 형이 가는 거랑 여기 있는 거지~?” “응.” “형 가면 여기 떨어져~?” “응.” 마루는 울지 않았다. 밧줄 끝의 매듭을 손가락으로 짚었다. 엄마 이름 나온 때를 묶어 둔 매듭들이었다. “형 안 가면 형네 떨어져~? 형네 친구도~?” 연우는 대답하지 못했다. “그럼 어려운 거네~ 형이 맞히는 거 아니네~ 맞는 매듭이 없는 거네~” “응. 없어.” 마루는 아까 쟀는데도 밧줄을 다시 우물 안으로 내렸다.', reward: { ieum: 2200 } } ] },
  { id: 'walls', name: '겹친 벽', icon: '🧱', cost: 7400, after: ['basis'], scene: [
      '가이아가 오라고 한 자리, 연우가 처음 넘어온 정착지 가장자리로 돌아온 밤이었다. 연우는 은솔의 집 문간에서 다 말했다. 흙의 손, 다섯 번의 해, 두 개의 기준. 은솔은 수첩을 꺼냈다가 펜을 내려놓았다. 적을 칸이 없는 얼굴이었다. <span class="say">“떨어진다는 게... 우물도...?”</span> <span class="say">“네.”</span> 마루는 은솔의 무릎에 등을 대고 자는 척하고 있었다.',
      '<span class="say">“알려 줘서 고마워... 모른 채로 떨어지는 것보다는...”</span> 은솔은 그 말을 끝내지 않았다.',
      '두 번째 해가 뜨자 물바가지를 든 이웃 여자가 연우 앞으로 왔다. 우물가에서 아이의 이름을 부르다 막혔던 사람이었다. <span class="say">“네가 이름을 붙여서 이렇게 된 거라며? 그럼 여기 골라. 여기 남아. 우리가 잘해 줄게. 여기서 아무도 너 안 미워해.”</span> 미워하는 얼굴이 아니라 부탁하는 얼굴이었다. 그게 더 어려웠다.',
      '그때 솥뚜껑을 닦던 남자의 집에서 비명이 났다. 이 세계의 흙벽 안쪽으로 계단 난간이 달린 회색 콘크리트 벽이 비스듬히 박혀 있었다. 지구 쪽에서 그 자리에 서 있는 빌라의 계단실이었다. 비틀린 문틀 안에서 아이가 기침했다. <span class="say">“열려야 되는데 *딸꾹* 안 열려. 애가 *딸꾹* 안에 있어.”</span>',
      '<span class="say">“붙잡을게. 집이 더 안 접히게.”</span> 서린이 말하자 세 걸음 뒤의 산란이 막았다. <span class="say">“안 돼. 지금 붙잡으면 저 회색 벽까지 같이 붙잡혀. 저 벽에 감긴 데를 끊어야 돼.”</span> <span class="say">“끊으면 지붕 내려앉아. 어디가 엉킨 데인지 넌 보여?”</span> 둘 다 줄을 보지 못했다.',
      '밑동 아래에서 권한이 넘어온 뒤로 연우에게는 모든 것의 줄이 보였다. 어디가 맞는 답인지는 적혀 있지 않았지만, 어디서 감겼는지는 보였다. <span class="say">“제가 말할게요. 엉킨 데요. 산란 씨가 거기만 끊어요. 서린 씨는 끊은 데 바로 옆을 이어요. 지붕 줄이요.”</span>',
      '<span class="say">“문틀 왼쪽 위요. 손가락 한 마디 아래.”</span> 산란이 끊고 서린이 이었다. 다음. 창틀 밑. 다음. 문고리 옆. 감긴 데가 풀릴 때마다 콘크리트 벽이 지구 쪽의 자리로, 비친 그림자처럼 빠져나갔다. 문틀이 펴졌다. 여자가 아이를 안고 나왔다. 남자의 딸꾹질이 멎어 있었다.',
      '오후 내내 셋은 겹친 집들을 돌았다. 모임터 기둥에서 한 번 어긋났다. 기둥이 저절로 비틀려 감긴 자리가 올라간 사이 산란의 손이 기둥의 줄을 끊었고, 지붕 들보가 미끄러졌다. 밑에 마루가 있었다. 서린이 어깨로 기둥을 받치고 엄지로 두 번 눌러 들보를 마루의 머리 위 한 뼘에서 멈췄다. <span class="say">“제가 늦게 봤어요.”</span> <span class="say">“알아.”</span> 산란의 얼굴이 하얬다. <span class="say">“괜찮아~ 안 맞았어~”</span> 그 뒤로 산란은 손을 대기 전에 숨을 한 번 셌다.' ],
    opts: [
      { t: '피가 난 산란의 손가락을 본다', h: '기록 천이 단단해진다', lore: '이번만 — 아이가 나온 뒤 산란이 손을 뗐을 때 손가락 끝에서 피가 났다. 지구의 줄은 이 세계의 줄보다 단단했던 모양이었다. 산란이 손을 옷에 문지르려 하자 서린이 그 손목을 잡았다. 은솔의 허리에 묶인 천 앞에서 산란의 손목을 잡고 가만있어, 안전해, 하던 날 이후 처음이었다. 서린은 아무 말 없이 자기 작업 셔츠의 소매 솔기를 이로 물어뜯었다. 오른손 엄지가 말려 있어서 왼손과 이로 천 조각을 산란의 손가락에 감았다. 서툴게. 산란은 손을 빼지 않았다. “우리 집 버릇.” “응.” “이번만이야.” “응.” 서린이 매듭을 지었다. 산란은 손을 거두고 한 걸음, 두 걸음, 세 걸음 물러났다. 다시 그 거리였다.', reward: { hp: 1 } },
      { t: '골짜기 길로 내려가는 산란을 본다', h: '나무가 실타래를 더 모은다', lore: '직접 해 — 세 번째 해에 산란이 말했다. “나 볕마을 갔다 올게. 어느 쪽으로 정해지든 거기 사람들도 알아야지. 가람은 아침마다 처음 듣잖아. 누가 말은 해 줘야지. 나 그 길 알아. 두 해 살았어.” 자기가 가겠다는 서린에게 산란이 말했다. “언니는 여기 있어. 여기 집들 아직 겹치잖아. 내가 끊은 데 언니가 안 이으면 지붕 내려앉아.” “가람한테. 내가…….” “직접 해. 올 때마다 직접 사과한다며. 그거 내가 대신 안 해. 가람이 여기까지 온다고 하면 데려올게.” 그날 저녁 서린은 혼자 집들을 돌았다. 끊을 사람이 없어 이을 데만 이었다. 몇 집은 문이 열리지 않은 채로 밤을 맞았다. 갈라진 엄지 끝에 피가 맺혔다. “걔 있으면.” 서린은 혼잣말처럼 말하고 다음 집으로 갔다.', reward: { idle: 1 } } ] },
  { id: 'answer', name: '인간의 답', icon: '📓', cost: 8800, after: ['asker', 'walls'], scene: [
      '네 번째 해와 함께 두 쪽에서 사람들이 도착했다. 고가 쪽에서는 장부 꾸러미를 멘 해담이 앞장섰다. <span class="say">“백열두 분입니다. 목록 밖 분이 넘어오신 자리에서 정하신다고 해서, 거기 있고 싶은 분들만 모셨습니다.”</span> 함지, 누리와 누리 엄마, 동이 할머니의 물동이를 든 가온, 실뭉치 하나만 든 보름. 여울과 달래는 자기 거리를 듣겠다고 남았다. 줄 맨 뒤에는 북쪽 둑길에서 내려온 하랑의 어머니가 있었다.',
      '골짜기 쪽에서는 볕마을에 다녀온 산란이 올라왔다. 보리가 산란의 손가락을 잡고 있었고, 그 뒤에 가람과 무진이 있었다. 하랑의 어머니가 산란의 세 걸음 앞에서 멈췄다. <span class="say">“보름마다 와서 말해 달라고 했죠. 못 올 것 같다고들 해서, 내가 왔어요. 다시 말해 줘요. 어디서든.”</span> <span class="say">“할게요. 어디서든.”</span>',

      '해가 지붕 위로 올랐을 때 솥뚜껑 남자의 아이가 비명을 질렀다. 아이의 손에 크기도 모양도 다른 손이 얇게 겹쳐 있었다. 우물가 사람들의 그림자가 두 개가 되었다. 해는 하나인데. 사람에게 닿기 시작했다.',
      '연우는 세 걸음 떨어져 선 서린과 산란 사이에 섰다. <span class="say">“지구를 고를게요.”</span> 생각한 것보다 쉽게, 생각한 것보다 무겁게 말이 나갔다. 여기 남으면 연우가 이 땅의 근원이 되어 아무도 묻지 않아도 되게 된다고, 그건 밑동 아래에서 한 대답을 뒤집는 거라고 연우는 말했다. 그리고 지구가 떨어진다고. 민재도.',

const SFX = (() => {

  const out = (a) => {

    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        const pulse = () => { if (!document.hidden) clock(BAL.thudFar); timer = setTimeout(pulse, (19 + Math.random() * 5) * 1000); };
        timer = setTimeout(pulse, (5 + Math.random() * 4) * 1000);

function drawMap() {
  const W = 360, H = 360, cx = W / 2, cy = H / 2, R = 128, NODES = curNodes();
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  // 중심 나무에서 각 조각으로 줄
  NODES.forEach((n, i) => {
    const ang = -Math.PI / 2 + i * Math.PI * 2 / NODES.length;
    n.x = cx + Math.cos(ang) * R; n.y = cy + Math.sin(ang) * R;
    const open = S.nodes[n.id] != null, red = S.red[n.id] > 0;
    svg += `<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="${red ? 'var(--red)' : open ? 'var(--root)' : '#2f3f36'}" stroke-width="${red ? 2 + S.red[n.id] : 2}" stroke-dasharray="${open ? '' : '4 6'}"/>`;
  });
  // 조각과 조각을 잇는 실: 앞 조각이 열려 있으면 밝게
  NODES.forEach((n) => (n.after || []).forEach(id => {
    const p = NODES.find(m => m.id === id); if (!p) return;
    const lit = S.nodes[id] != null;
    svg += `<line x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="${lit ? 'var(--gold)' : '#2f3f36'}" stroke-width="${lit ? 2 : 1.5}" stroke-dasharray="${lit && S.nodes[n.id] != null ? '' : '2 5'}" opacity="${lit ? .8 : .6}"/>`;
  }));
  svg += `<circle cx="${cx}" cy="${cy}" r="34" fill="#16231d" stroke="var(--gold)" stroke-width="2"/>
    <text x="${cx}" y="${cy + 10}" font-size="30" text-anchor="middle">${curCh().center}</text>`;
  NODES.forEach((n) => {
    const open = S.nodes[n.id] != null, ready = nodeReady(n), afford = ready && S.ieum >= n.cost;
    const fill = open ? '#1e3a33' : afford ? '#2a2614' : '#141b17';
    const stroke = open ? 'var(--root)' : afford ? 'var(--gold)' : '#2f3f36';
    svg += `<g data-node="${n.id}" style="cursor:pointer">
      <circle cx="${n.x}" cy="${n.y}" r="30" fill="${fill}" stroke="${stroke}" stroke-width="${afford && !open ? 3 : 2}">
        ${afford && !open ? '<animate attributeName="r" values="29;33;29" dur="1.4s" repeatCount="indefinite"/>' : ''}</circle>
      <text x="${n.x}" y="${n.y + 8}" font-size="22" text-anchor="middle" opacity="${open || afford ? 1 : .35}">${n.icon}</text>
      <text class="node-label" x="${n.x}" y="${n.y + 46}">${n.name}</text>
      ${open ? '' : ready ? `<text class="node-cost" x="${n.x}" y="${n.y + 60}">실타래 ${n.cost}</text>`
        : `<text class="node-cost" x="${n.x}" y="${n.y + 60}" style="fill:var(--dim)">${needNames(n)} 다음</text>`}
    </g>`;
  });
  svg += '</svg>';
  $('map').innerHTML = svg;
  $('map').querySelectorAll('[data-node]').forEach(g => g.onclick = () => openNode(g.dataset.node));
}

function openNode(id) {
  const n = curNodes().find(x => x.id === id);
  const open = S.nodes[id] != null;
  const both = (S.lore[id] || []).length >= 2;
  if (both) { show('codex'); renderCodex(); return; }
  if (!open && !nodeReady(n)) {
    modal(`<h2>${n.name}</h2><div class="sub">이 조각은 ${needNames(n)} 조각에서 이어진다. 그 조각을 먼저 열자.</div>`, [['확인']]);
    return;
  }
  if (!open && S.ieum < n.cost) {
    modal(`<h2>${n.name}</h2><div class="sub">실타래가 ${n.cost - Math.floor(S.ieum)} 모자란다. 낮에 분류하거나 나무에서 받아 오자.</div>`, [['확인']]);
    return;
  }
  const replayCost = Math.ceil(n.cost * 1.5);
  if (open) {
    if (S.ieum < replayCost) {
      modal(`<h2>${n.name} — 다른 선택지</h2><div class="sub">다른 답을 고르려면 실타래가 ${replayCost} 필요하다.</div>`, [['확인']]);
      return;
    }
    modal(`<h2>${n.name} — 다른 선택지</h2><div class="sub">이 장면을 다시 열고 아직 고르지 않은 답을 고른다. (실타래 ${replayCost})</div>`,
      [['다시 열기', () => { S.ieum -= replayCost; playStory(n, true); }, true], ['그만두기']]);
    return;
  }
  S.ieum -= n.cost; playStory(n, false);
}

function tapScene(title, lines, onEnd) {  // 탭할 때마다 한 문단씩, 다 보이면 onEnd
  show('story');
  $('sTitle').textContent = title;
  $('sScene').innerHTML = '';
  $('sOpts').innerHTML = '<div class="tap-hint">눌러서 넘기기 ▾</div>';
  let i = 0;
  const next = () => {
    if (i < lines.length) {
      const p = document.createElement('p'); p.innerHTML = lines[i++]; $('sScene').appendChild(p); SFX.page();
      $('sScene').scrollTop = $('sScene').scrollHeight;
      if (i < lines.length) return;
    }
    $('story').onclick = null; $('sOpts').innerHTML = '';
    onEnd();
  };
  next();
  $('story').onclick = next;
}
function playStory(n, replay) {
  tapScene('기록 조각 — ' + n.name, n.scene, () => {
    const taken = S.lore[n.id] || [];
    n.opts.forEach((o, k) => {
      if (replay && taken.includes(k)) return;
      const b = document.createElement('button'); b.className = 'opt';
      b.innerHTML = `${o.t}<span class="hint">${o.h}</span>`;
      b.onclick = (e) => { e.stopPropagation(); chooseStory(n, k); };
      $('sOpts').appendChild(b);
    });
  });
}
function chooseStory(n, k) {
  const o = n.opts[k];
  S.nodes[n.id] = S.nodes[n.id] ?? k;
  (S.lore[n.id] = S.lore[n.id] || []).push(k);
  const r = o.reward; let gain = '';
  if (r.ieum) { S.ieum += r.ieum; gain = `실타래 +${r.ieum}`; }
  if (r.idle) { S.idle += r.idle; gain = `나무가 모으는 실타래 +${r.idle * BAL.idlePerHour}/시간`; }
  if (r.slow) { S.slow += r.slow; gain = '밤에 해체자가 느려진다'; }
  if (r.hp) { S.hpBonus += r.hp; gain = '기록 천 +1'; }
  S.stab += 0.004; save();
  $('sOpts').innerHTML = '';
  const div = document.createElement('div'); div.className = 'lore';
  div.innerHTML = `<b>새 기록</b><br>${o.lore}<div class="sub" style="margin-top:6px">${gain}</div>`;
  $('sScene').appendChild(div); SFX.lore();
  const b = document.createElement('button'); b.className = 'big-btn'; b.textContent = '기록 천으로';
  b.onclick = () => { show('home'); renderHome(); checkChapter(); };
  $('sOpts').appendChild(b);
  buzz([10, 40, 10]);
}

  }
}

function renderCodex() {
  $('codexList').innerHTML = (S.done.two ? '<div class="row" style="gap:8px;margin-bottom:6px"><button class="ghost-btn" id="replayEnd" style="flex:1">마지막 장면 다시 보기</button><button class="ghost-btn" id="replayStart" style="flex:1">첫 장면 다시 보기</button></div>' : '') + CHAPTERS.slice(0, S.unlocked + 1).map(ch =>
    `<h4 style="color:var(--dim);margin:12px 0 6px">${ch.name} · ${loreCount(ch)}/${ch.nodes.length * 2}</h4>` + ch.nodes.slice().sort((a, b) => a.cost - b.cost).map(n => {
    const taken = S.lore[n.id] || [];

  }).join('')).join('');
}

$('codexBtn').onclick = () => { renderCodex(); show('codex'); };
$('codexBack').onclick = () => { show('home'); renderHome(); };
$('streakBtn').onclick = () => modal(`<h2>마루의 매듭</h2><div class="sub">하루에 한 번 낮을 마치면 마루가 매듭을 하나 짓는다. 매듭이 이어질수록 아침에 받는 실타래가 늘어난다.<br><br>지금 매듭: ${S.streak}개</div>`, [['확인']]);

// ───────────────────────── 낮: 분류 ─────────────────────────
const DAY_CARDS = 8;
let D = null, timerId = null;
function startDay(tutorial) {
  const pool = SPECIMENS.slice();
  // 붉은 줄이 남은 표본을 먼저 다시 낸다(틀린 것을 배워 고치기)
  const retry = pool.filter(s => S.red['sp_' + s.id]);
  const rest = pool.filter(s => !S.red['sp_' + s.id]).sort(() => Math.random() - .5);
  let deck = tutorial === true
    ? Object.keys(TUTORIAL).map(id => pool.find(s => s.id === id))
    : retry.concat(rest).slice(0, DAY_CARDS).sort(() => Math.random() - .5);
  // 고정된 볕마을은 같은 하루를 되풀이한다: 붙잡은 첫날의 표본이 같은 순서로 다시 나온다
  if (tutorial !== true && fixedHere()) {
    const same = (S.sameDay || []).map(id => pool.find(s => s.id === id)).filter(Boolean);
    if (same.length === DAY_CARDS) deck = same; else { S.sameDay = deck.map(s => s.id); save(); }
  }
  D = { deck, idx: 0, step: 0, earned: 0, red: 0, blur: 0, combo: 0, maxCombo: 0, observed: false, correct: 0, path: [],
    tutorial: tutorial === true, waiting: false };
  $('cCoach').classList.toggle('on', D.tutorial);
  $('lockBtn').style.display = D.tutorial ? 'none' : '';
  show('day'); nextCard();
}
function coach(html, warn) { $('cCoach').innerHTML = html; $('cCoach').classList.toggle('warn', !!warn); }
function cardTime(sp) { return sp.deep ? 2.0 : 4.0; }  // 깊은 표본은 튜토리얼 뒤의 2.0
function nextCard() {
  if (D.idx >= D.deck.length) return endDay();
  const sp = D.deck[D.idx]; D.step = 0; D.observed = false; D.path = [];
  $('cTag').textContent = '표본 ' + String(D.idx + 1).padStart(2, '0');
  $('cName').textContent = sp.name;
  $('cGlyph').className = 'glyph'; $('cGlyph').innerHTML = artOf(sp);
  $('cClue').textContent = ''; $('cPath').textContent = '';
  $('dCount').textContent = (D.idx + 1) + '/' + D.deck.length;
  $('observeBtn').disabled = false; $('observeBtn').style.opacity = 1;
  $('observeBtn').style.display = D.tutorial && sp.id === 'water' ? 'none' : '';  // 단서 보기는 둘째 표본에서 가르친다
  $('card').style.opacity = 0; $('card').style.transform = 'translateY(14px)';
  requestAnimationFrame(() => { $('card').style.opacity = 1; $('card').style.transform = ''; });
  showStep();
}
function showStep() {
  const sp = D.deck[D.idx], st = sp.steps[D.step];
  $('cPrompt').textContent = st.final ? '최종 분류:' : '분류:';
  $('optL').innerHTML = st.o[0]; $('optR').innerHTML = st.o[1];
  $('lockBtn').disabled = D.step === 0; $('lockBtn').style.opacity = D.step === 0 ? .4 : 1;
  $('dIeum').textContent = fmt(S.ieum + D.earned); $('dRed').textContent = D.red;
  if (D.tutorial) coach(TUTORIAL[sp.id].steps[D.step]);
  startTimer(cardTime(sp));
}
function startTimer(t) {
  clearInterval(timerId);
  const end = performance.now() + t * 1000;
  D.tLimit = t;
  const tick = () => {
    const left = Math.max(0, (end - performance.now()) / 1000);
    D.tLeft = left;
    $('cTimer').textContent = left.toFixed(1);
    $('cTimer').classList.toggle('low', left < 1.0);
    const half = Math.ceil(left * 2);  // 마지막 1초는 0.5초마다 똑딱
    if (left < 1.0 && half !== D.lastTick) { D.lastTick = half; SFX.tick(); }
    if (left <= 0) {
      clearInterval(timerId);
      if (D.tutorial) { timerId = null; D.waiting = true; coach(TUT_WAIT); }  // 첫 판은 시간 초과로 벌하지 않는다
      else timeout();
    }
  };
  tick(); timerId = setInterval(tick, 50);
}
function stepValue() {  // 깊이 내려갈수록, 빨리 고를수록 크게
  const base = 3 + D.step * 3;
  const speed = 1 + (D.tLeft / D.tLimit);
  const mult = 1 + Math.min(D.combo, 10) * 0.25;
  return Math.round(base * speed * mult * (D.observed ? .5 : 1));
}
function choose(side, ev) {
  if (!D || (timerId == null && !D.waiting)) return;
  clearInterval(timerId); timerId = null; D.waiting = false;
  const sp = D.deck[D.idx], st = sp.steps[D.step];
  const x = ev ? ev.clientX : innerWidth / 2, y = ev ? ev.clientY : innerHeight / 2;
  if (D.tutorial && side !== st.a) {  // 첫 판의 오답: 붉은 줄을 보여 주고 같은 단계를 다시 고르게 한다
    D.combo = 0; showCombo();
    pop('붉은 줄', 'var(--red)', x, y - 20);
    flash('flash-bad'); $('card').classList.add('shake'); setTimeout(() => $('card').classList.remove('shake'), 300);
    buzz([30, 30, 60]); SFX.bad(); coach(TUT_WRONG, true);
    setTimeout(() => startTimer(cardTime(sp)), 500);
    return;
  }
  if (side === st.a) {
    D.combo++; D.maxCombo = Math.max(D.maxCombo, D.combo);
    const v = stepValue(); D.earned += v;
    D.path.push(st.o[side]); $('cPath').textContent = D.path.join(' › ');
    pop('+' + v, 'var(--root)', x, y - 20);
    flash('flash-ok'); buzz(12); showCombo();
    D.step++;
    if (D.step >= sp.steps.length) { SFX.bigOk(D.combo); finishCard(true); }
    else { SFX.ok(D.combo); setTimeout(showStep, 220); }
  } else {
    D.combo = 0; D.red++;
    S.red['sp_' + sp.id] = (S.red['sp_' + sp.id] || 0) + 1 + D.step;  // 깊이 욕심낸 오답일수록 굵은 줄
    pop('붉은 줄', 'var(--red)', x, y - 20);
    flash('flash-bad'); $('card').classList.add('shake'); setTimeout(() => $('card').classList.remove('shake'), 300);
    buzz([30, 30, 60]); SFX.bad(); showCombo();
    finishCard(false);
  }
}
function timeout() {
  // 시간이 다 되면 정답도 오답도 아닌 시간 초과로 남는다
  timerId = null; D.combo = 0; D.blur++;
  $('cGlyph').classList.add('smudge');  // 스크린은 번진 채 대상 위에 남는다
  flash('flash-blur'); SFX.blur(); pop('시간 초과', 'var(--dim)', innerWidth / 2, innerHeight / 2);
  finishCard(false);
}
function finishCard(ok) {
  const sp = D.deck[D.idx];
  if (ok) {
    D.correct++; $('cGlyph').classList.add('traced');  // 맞히면 하늘색 선이 대상을 따라 뻗는다
    if (S.red['sp_' + sp.id]) { delete S.red['sp_' + sp.id]; pop('붉은 줄이 풀렸다', 'var(--gold)', innerWidth / 2, innerHeight / 3); }
  }
  D.idx++;
  if (D.tutorial && ok) { setTimeout(() => modal(TUTORIAL[sp.id].done, [['계속', nextCard, true]]), 420); return; }
  setTimeout(nextCard, ok ? 420 : 650);
}
function lockHere(ev) {  // 한 단계 이상 맞힌 뒤 여기서 멈추기: 안전하게 마무리
  if (D.step === 0 || timerId == null) return;
  clearInterval(timerId); timerId = null;
  pop('멈춤', 'var(--gold)', ev.clientX, ev.clientY - 20); buzz(10); SFX.lock();
  finishCard(true);
}
function showCombo() {
  const c = $('combo');
  if (D.combo >= 2) { c.textContent = '연속 ' + D.combo + ' ×' + (1 + Math.min(D.combo, 10) * 0.25).toFixed(2); c.style.opacity = 1; }
  else c.style.opacity = 0;
}
function flash(cls) { const c = $('card'); c.classList.add(cls); setTimeout(() => c.classList.remove(cls), 260); }
$('optL').onclick = (e) => choose(0, e);
$('optR').onclick = (e) => choose(1, e);
$('lockBtn').onclick = lockHere;
$('observeBtn').onclick = () => {
  if (D.observed) return; D.observed = true;
  $('cClue').textContent = D.deck[D.idx].clue; $('observeBtn').disabled = true; $('observeBtn').style.opacity = .4;
};
// 스와이프로도 고른다
(() => {
  let sx = null;
  $('card').addEventListener('pointerdown', e => { sx = e.clientX; });
  $('card').addEventListener('pointermove', e => { if (sx != null) $('card').style.transform = `translateX(${(e.clientX - sx) * .4}px) rotate(${(e.clientX - sx) * .03}deg)`; });
  const up = e => {
    if (sx == null) return; const dx = e.clientX - sx; sx = null; $('card').style.transform = '';
    if (Math.abs(dx) > 70) choose(dx < 0 ? 0 : 1, e);
  };
  $('card').addEventListener('pointerup', up); $('card').addEventListener('pointercancel', up);
})();
document.addEventListener('keydown', e => {
  if (!$('day').classList.contains('on')) return;
  if (e.key === 'ArrowLeft') choose(0); if (e.key === 'ArrowRight') choose(1);
});

function endDay() {
  clearInterval(timerId); timerId = null;
  S.ieum += D.earned;
  S.stab += D.correct * 0.001;
  const today = new Date().toISOString().slice(0, 10);
  if (S.lastDay !== today) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak = S.lastDay === y ? S.streak + 1 : 1; S.lastDay = today;
  }
  S.hand = Math.max(0, S.hand - D.correct * 2);  // 낮에 번 여유가 서린의 손을 푼다
  S.day++; save();
  modal(`<h2>해가 진다</h2>
    <div class="stat"><span>맞힌 표본</span><b>${D.correct}/${D.deck.length}</b></div>
    <div class="stat"><span>얻은 실타래</span><b>${fmt(D.earned)}</b></div>
    <div class="stat"><span>최고 연속</span><b>${D.maxCombo}</b></div>
    <div class="stat"><span>붉은 줄</span><b style="color:var(--red)">${D.red}</b></div>
    <div class="stat"><span>시간 초과</span><b style="color:var(--dim)">${D.blur}</b></div>

  const gift = S.onboarded ? 0 : Math.max(0, SETTLE_NODES[0].cost - Math.floor(S.ieum));
  S.ieum += gift;
  // 고정한 밤에는 지켜도 안정화율이 오르지 않는다(자라나는 것이 멈춘다)
  const keptGain = kept ? (N.fixUsed ? 0 : 0.002) : -0.002;
  S.stab = Math.max(0, S.stab + keptGain - lostNames * 0.0005);
  curNodes().forEach(n => { S.red[n.id] = 0; });
  dawnHand();
  save();
  SFX.amb(ambFor('home'));  // 새벽이 오면 밤의 울림이 걷힌다
  SFX.dawn(kept);
  const result = kept ? (lostNames ? '기록 천은 지켰다. 끊긴 줄이 있다.' : '한 줄도 끊기지 않았다.') : '기록 천이 찢겼다. 그래도 아침은 온다.';
  const buttons = [['아침으로', goHome, true]];
  // 첫 5분에는 광고를 권하지 않는다
  if (S.onboarded) buttons.unshift(['광고 보고 아침 보상 두 배 (시험용: 바로 지급)', () => { S.ieum += morning; save(); goHome(); }]);
  modal(`<h2>새벽</h2><div class="sub">${result}${N.fixUsed && kept ? '<br>붙잡은 밤이었다. 안정화율은 오르지 않았다.' : ''}</div>
    <div class="stat"><span>쫓아낸 해체자</span><b>${N.kills}</b></div>
    <div class="stat"><span>끊긴 줄</span><b style="color:var(--red)">${lostNames}</b></div>
    <div class="stat"><span>마루의 매듭 보너스</span><b>실타래 +${morning}</b></div>
    ${gift ? `<div class="stat"><span>나무 수확</span><b>+${gift}</b></div>` : ''}
    ${handStat()}
    <div class="stat"><span>영역 안정화율</span><b>${S.stab.toFixed(3)}%</b></div>`, buttons);
}
function fixedDawn() {  // 고정된 볕마을: 밤 없이 아침. 매듭 보너스는 받지만 안정화율은 그대로다
  const morning = 5 + Math.min(S.streak, 7) * 2;
  S.ieum += morning; save();
  SFX.dawn(true);
  modal(`<h2>밤 없는 저녁</h2><div class="sub">바깥에는 밤이 왔다. 볕마을 안은 늦은 오후 그대로였다. 주민들은 저녁이라며 잠들었다.<br>기록 천은 한 올도 변하지 않았다.</div>
    <div class="stat"><span>마루의 매듭 보너스</span><b>실타래 +${morning}</b></div>
    ${handStat()}
    <div class="stat"><span>영역 안정화율</span><b>${S.stab.toFixed(3)}% (그대로)</b></div>`,
    [['광고 보고 아침 보상 두 배 (시험용: 바로 지급)', () => { S.ieum += morning; save(); goHome(); }], ['아침으로', goHome, true]]);
}
function goHome() {
  show('home'); renderHome(); tickIdle(); PWA.render();
  if (!S.onboarded) {
    S.onboarded = true; save(); syncAmb();
    modal(`<h2>기록 천</h2><div class="sub">모은 실타래로 기록 천의 조각을 연다. 조각마다 선택지가 둘이고, 고른 쪽이 이 세계의 기록으로 남는다.<br><br>빛나는 <b style="color:var(--gold)">우물</b>을 눌러 보자.</div>`, [['확인', null, true]]);
  }
}

$('dayBtn').onclick = () => startDay(false);

// ───────────────────────── 앱으로 두기(PWA) ─────────────────────────
// 서비스 워커가 게임 파일을 저장해 두어, 한 번 연 뒤에는 인터넷 없이도 돌아간다.
// 홈 화면에 둔 앱으로 열면 저장(localStorage)이 지워지지 않게 브라우저에 부탁한다.
const PWA = (() => {
  let deferred = null;
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const ios = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // 첫 판을 마치기 전에는 권하지 않는다. 버튼만 보이고, 저절로 뜨는 창은 없다
  const render = () => {
    const can = !standalone() && S.onboarded && (deferred || ios());
    $('installBtn').style.display = can ? '' : 'none';
  };
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; render(); });
  window.addEventListener('appinstalled', () => { deferred = null; render(); });
  if (standalone() && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  $('installBtn').onclick = () => {
    if (deferred) { const d = deferred; deferred = null; d.prompt(); d.userChoice.finally(render); return; }
    modal(`<h2>홈 화면에 두기</h2><div class="sub">브라우저의 공유 버튼을 누르고 <b>‘홈 화면에 추가’</b>를 고르면 된다.<br>홈 화면의 THE ROOT로 열면 기록이 브라우저 정리에 잘 지워지지 않고, 인터넷이 없어도 이어서 할 수 있다.</div>`, [['확인', null, true]]);
  };
  return { render, standalone };
})();
const renderMute = () => { $('muteBtn').textContent = S.mute ? '🔇' : '🔊'; };
$('muteBtn').onclick = () => { S.mute = !S.mute; save(); renderMute(); SFX.muted(); SFX.coin(); };
renderMute();
renderHome(); tickIdle(); PWA.render();
// 첫 실행: 1화 장면으로 바로 들어간다. v0.1 저장(seen)이 있으면 건너뛴다.
if (S.seen && !S.onboarded) { S.onboarded = true; save(); }
function startTutorial() {
  $('sSkip').style.display = 'none';
  modal(`<h2>표본 01 — 물</h2><div class="sub">스크린은 연우에게만 보인다. 둘 중 하나를 눌러라. 맞히면 <b style="color:var(--root)">실타래</b>가 모인다.<br>버튼 대신 카드를 좌우로 밀어도 된다.</div>`,
    [['분류한다', () => startDay(true), true]]);
}
if (!S.onboarded) {
  S.seen = true; save();
  $('sSkip').style.display = '';
  $('sSkip').onclick = (e) => { e.stopPropagation(); $('story').onclick = null; startTutorial(); };
  tapScene('1화 — 부수고 싶은 밤', PROLOGUE, () => {
    const b = document.createElement('button'); b.className = 'big-btn'; b.textContent = '표본 01 — 물';
    b.onclick = startTutorial; $('sOpts').appendChild(b);
  });
}
</script>
</body>
</html>
